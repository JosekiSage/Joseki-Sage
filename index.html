                  <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
                  <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
                  <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 27h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
                </svg>
                <span>{driveStatus==="syncing"?"Drive…":driveStatus==="error"?"Drive!":"Drive"}</span>
              </button>
              {showDriveMenu&&(
                <div style={{position:"absolute",right:0,top:"calc(100% + 4px)",background:"var(--color-background-primary)",
                  border:"0.5px solid var(--color-border-secondary)",borderRadius:6,minWidth:210,zIndex:300,
                  boxShadow:"0 4px 16px rgba(0,0,0,0.25)",padding:"0.5rem 0"}}>
                  {!driveToken?(
                    <div>
                      <div style={{padding:"0.4rem 0.9rem 0.5rem",fontSize:"0.78rem",color:"var(--color-text-secondary)",borderBottom:"0.5px solid var(--color-border-tertiary)",marginBottom:"0.4rem",lineHeight:1.5}}>
                        Sync your custom library with Google Drive
                      </div>
                      <div style={{padding:"0 0.75rem"}}>
                        <button className="btn btnsm" style={{width:"100%",textAlign:"center"}}
                          onClick={function(){ setShowDriveMenu(false); driveLoadGsiThenConnect(); }}>
                          Connect Google Drive
                        </button>
                      </div>
                      {driveError&&<div style={{padding:"0.4rem 0.9rem",fontSize:"0.72rem",color:"var(--color-text-danger)"}}>{driveError}</div>}
                    </div>
                  ):(
                    <div>
                      <div style={{padding:"0.4rem 0.9rem",fontSize:"0.72rem",
                        color:driveStatus==="error"?"var(--color-text-danger)":"var(--color-text-tertiary)",
                        borderBottom:"0.5px solid var(--color-border-tertiary)",marginBottom:"0.4rem"}}>
                        {driveStatus==="syncing"?"Syncing…":driveStatus==="loading"?"Loading…":driveStatus==="error"?driveError:("Last synced: "+driveFormatSync(driveLastSync))}
                      </div>
                      <div style={{padding:"0 0.75rem",display:"flex",flexDirection:"column",gap:"0.3rem"}}>
                        {driveStatus==="error"?(
                          <button className="btn btnsm" style={{width:"100%",textAlign:"center"}}
                            onClick={function(){ setShowDriveMenu(false); setDriveStatus("idle"); setDriveError(null); driveLoadGsiThenConnect(); }}>
                            Reconnect
                          </button>
                        ):(
                          <button className="btn btnsm" style={{width:"100%",textAlign:"center"}}
                            onClick={function(){ setShowDriveMenu(false); driveSaveNow(driveToken,driveFileId); }}
                            disabled={driveStatus==="syncing"||driveStatus==="loading"}>
                            Sync now
                          </button>
                        )}
                        <button className="btn btnsm" style={{width:"100%",textAlign:"center",color:"var(--color-text-danger)"}}
                          onClick={function(){ driveDisconnect(); }}>
                          Disconnect
                        </button>

                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div style={{position:"relative",display:"inline-block"}} onClick={function(e){ e.stopPropagation(); }}>

                </div>
              )}
            </div>
            <div style={{position:"relative",display:"inline-block",marginLeft:4}} onClick={function(e){ e.stopPropagation(); }}>
              <button className="btn btnxs" style={{color:"#C8BCA8",borderColor:"#5A4A30"}}
                onClick={function(){ setShowImportMenu(function(v){ return !v; }); setShowExportMenu(false); }}>Import</button>
              {showImportMenu&&(
                <div style={{position:"absolute",top:"110%",right:0,background:"#2A2018",border:"0.5px solid #5A4A30",borderRadius:6,zIndex:200,minWidth:180,boxShadow:"0 4px 16px rgba(0,0,0,0.4)"}}>
                  <div style={{padding:"0.3rem 0.7rem",fontSize:"0.68rem",color:"#8B7A60",borderBottom:"0.5px solid #5A4A30"}}>Choose library</div>
                  <button className="btn" style={{display:"block",width:"100%",textAlign:"left",padding:"0.4rem 0.7rem",fontSize:"0.78rem",color:"#C8BCA8",border:"none",borderRadius:0}} onClick={function(){ setConfirmDialog({msg:"This will overwrite the entire Default Library. This cannot be undone. Continue?",onConfirm:function(){ importDefaultRef.current&&importDefaultRef.current.click(); }}); setShowImportMenu(false); }}>Default Library</button>
                  <button className="btn" style={{display:"block",width:"100%",textAlign:"left",padding:"0.4rem 0.7rem",fontSize:"0.78rem",color:"#C8BCA8",border:"none",borderRadius:0}} onClick={function(){ setConfirmDialog({msg:"This will overwrite the entire Custom Library. This cannot be undone. Continue?",onConfirm:function(){ importCustomRef.current&&importCustomRef.current.click(); }}); setShowImportMenu(false); }}>Custom Library</button>

              <div style={{fontSize:"2rem",fontWeight:700,letterSpacing:"-0.03em",lineHeight:1}}>Joseki Sage</div>

                    {/* About */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">About</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              Joseki Sage is a browser-based Go joseki training application. It allows you to
              build and organize a personal library of joseki sequences, study them in an
              interactive editor, and test your recall in practice mode, which quizzes you
              on correct continuations, tracks your score and accuracy across sessions, and
              supports mirroring and color inversion to train pattern recognition from any orientation.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.75rem"}}>
              The app runs entirely in your browser as a single HTML file with no server
              required. Your custom library can be synced automatically across devices using
              Google Drive, or backed up and transferred manually as JSON files.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.75rem"}}>
              This app was vibe coded with AI due to my lacking the technical skills to create it myself
              and no existing application having the desired functionality. If you have understandable
              moral or practical objections to using an application created in this way, then you may
              want to look for an alternative.
            </p>
          </div>

          {/* How to use */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">How to Use</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}><strong>Library</strong> - Browse and organize joseki, enable or disable them for practice. Import the default library via the Download menu in the top bar. Use folders to organize between Default and Custom libraries. Connect Google Drive via the Drive button to sync your custom library automatically across devices.</p>
              <p style={{marginBottom:"0.6rem"}}><strong>Practice</strong> - Select joseki in the library and tap Practice, or use the start button in the Practice tab. The app randomly assigns you to play the first or second move of each sequence. Correct continuations are scored; wrong moves reveal valid alternatives. Settings allow mirroring, color inversion, and toggling of hints and comments.</p>
              <p style={{marginBottom:"0.6rem"}}><strong>New / Editor</strong> - Create joseki from scratch or edit existing ones. Place stones, add setup stones, annotate continuations with letters or markers, and write position comments. Import and export individual joseki as SGF files.</p>
              <p><strong>Scoring</strong> - Points are awarded per correct move, multiplied by a streak bonus (up to 3x at 5 consecutive correct moves). Accuracy is tracked as a percentage across the session. Scoring can be disabled in practice settings.</p>
            </div>
          </div>

          {/* Google Drive sync */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Google Drive Sync</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}>
                Tap the <strong>Drive</strong> button in the top bar of the library and select <strong>Connect Google Drive</strong> to sync your custom library automatically across all your devices and browsers. You will be asked to sign in to your Google account and grant permission to access a single file. The app cannot see any other files in your Drive.
              </p>
              <p style={{marginBottom:"0.6rem"}}>
                Once connected, your library is saved to a file called <code>joseki-custom-library.json</code> in your Drive whenever you make changes, and fetched silently in the background when you open the app. The Default Library is not synced.
              </p>
              <p style={{marginBottom:"0.6rem"}}>
                If both a Drive file and local data exist when you first connect, the app will ask which version to use. Google sign-in sessions expire after approximately one hour — if the Drive button shows an error indicator, tap it and select <strong>Reconnect</strong>.
              </p>
              <p>
                Google Drive sync requires an internet connection and is not available when the app is loaded from the browser cache while offline.
              </p>
            </div>
          </div>

          {/* Offline & PWA */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Offline & Installing as an App</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}>
                Joseki Sage works offline on all platforms — mobile and desktop — after your first visit. The app uses a service worker to cache itself in your browser automatically. Once cached, it loads and runs fully with no internet connection. Your library data is stored locally in your browser and is always available offline.
              </p>
              <p style={{marginBottom:"0.6rem"}}>
                Joseki Sage can also be installed as a Progressive Web App (PWA) for a native app-like experience with its own icon and window. Installing is optional — the app works fully in the browser with or without installation, including offline.
              </p>
              <p style={{marginBottom:"0.3rem"}}><strong>Android (Chrome or Firefox):</strong> Tap the browser menu (⋮) and select "Add to Home Screen" or "Install app".</p>
              <p style={{marginBottom:"0.3rem"}}><strong>iOS (Safari):</strong> Tap the Share button (□↑) and select "Add to Home Screen".</p>
              <p><strong>Desktop (Chrome/Edge):</strong> Click the install icon (⊕) in the address bar or use the browser menu and select "Install". The app opens in its own window and appears in your taskbar or dock.</p>
            </div>
          </div>

          {/* Credits */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Credits & Acknowledgements</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}>
                Inspired by <a href="https://joseki.cat" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>Joseki.cat</a>, an excellent joseki trainer without which this app would not exist.
              </p>
              <p style={{marginBottom:"0.6rem"}}>
                Default library data sourced from the <a href="https://online-go.com/joseki" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>OGS Joseki Explorer</a>, a community-maintained database of Go joseki sequences. Used with appreciation for the Go community's open contribution. Full credit for all the valuable information belongs to the contributors; any errors can be attributed to me.
              </p>
              <p>
                Stone placement and capture sounds from <a href="https://github.com/SabakiHQ/Sabaki" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>Sabaki</a> by Yichuan Shen (Copyright 2015-2022), used under the MIT licence. The MIT licence requires that this copyright notice be reproduced: Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated files to deal in the software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies, subject to the above copyright notice and this permission notice being included in all copies or substantial portions.
              </p>
            </div>
          </div>

          {/* License */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Licence</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              Joseki Sage is released under the <strong>Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International</strong> licence (CC BY-NC-SA 4.0). You are free to use, share, and adapt this application for non-commercial purposes, provided you give appropriate credit and distribute any adaptations under the same licence.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.6rem"}}>
              <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>View full licence text</a>
            </p>
          </div>

          {/* Feedback & Support */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Feedback & Support</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginBottom:"0.6rem"}}>
              Found a bug or have a suggestion? Send feedback to{" "}
              <a href="mailto:josekisage@gmail.com" style={{color:"#4A8870"}}>josekisage@gmail.com</a>.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginBottom:"0.6rem"}}>
              If you enjoy Joseki Sage and would like to buy me a coffee, that would be lovely:{" "}
              <a href="https://ko-fi.com/josekisage" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>ko-fi.com/josekisage</a>
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              This app is a non-commercial work and will always be free.
            </p>
          </div>

          <div style={{textAlign:"center",marginTop:"1.5rem"}}>
            <button className="btn btnsm" onClick={function(){ setTab(TABS.library); }}>Back to Library</button>
          </div>
        </div>
      )}

      {showHelp&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:300,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"1.5rem 0.75rem"}}
          onClick={function(e){ if(e.target===e.currentTarget) setShowHelp(false); }}>
          <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:10,width:"100%",maxWidth:640,boxShadow:"0 8px 32px rgba(0,0,0,0.35)",position:"relative"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.9rem 1.1rem",borderBottom:"0.5px solid var(--color-border-secondary)"}}>
              <span style={{fontWeight:600,fontSize:"0.9rem",color:"var(--color-text-primary)"}}>
                {tab===TABS.library?"Help — Library":tab===TABS.quiz&&!qEntry?"Help — Practice Settings":tab===TABS.quiz?"Help — Practice Mode":"Help — Editor"}
              </span>
              <button onClick={function(){ setShowHelp(false); }}
                style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-secondary)",fontSize:"1.3rem",lineHeight:1,padding:"0 2px"}}>×</button>
            </div>
            <div style={{padding:"1.1rem 1.25rem",fontSize:"0.85rem",lineHeight:1.75,color:"var(--color-text-secondary)",maxHeight:"80vh",overflowY:"auto"}}>
              {(function(){
                function H2(props){ return <p style={{fontWeight:600,fontSize:"0.9rem",color:"var(--color-text-primary)",marginTop:"1.2rem",marginBottom:"0.3rem"}}>{props.children}</p>; }
                function P(props){ return <p style={{marginBottom:"0.6rem"}}>{props.children}</p>; }
                function B(props){ return <strong>{props.children}</strong>; }
                function Li(props){ return <li style={{marginBottom:"0.3rem"}}>{props.children}</li>; }

                if(tab===TABS.library) return (
                  <div>
                    <P>The Library is the home screen of Joseki Sage. It shows all your joseki organized into folders, and is the starting point for both practice and editing.</P>
                    <H2>Search</H2>
                    <P>Use the search box at the top of the library to filter joseki in real time by name or folder name, across both Default and Custom libraries. Click × to clear the search.</P>
                    <H2>Folders</H2>
                    <P>Joseki are organized into two top-level libraries: <B>Default</B> and <B>Custom</B>. Within each you can create named folders to group related joseki.</P>
                    <P>When first opened in a browser, the app automatically fetches the Default Library. If opened from a local file, it starts with a small demo library — import the full default library manually via the Import menu.</P>
                    <P><B>Creating a folder:</B> Enter a name in the folder field and tap + Folder.</P>
                    <P><B>Renaming or deleting a folder:</B> Tap the ⋮ options next to the folder name. Deleting a folder also deletes all joseki inside it. This cannot be undone.</P>
                    <P><B>Moving joseki between folders:</B> Open the joseki editor and change the Folder field at the top.</P>
                    <H2>Joseki List</H2>
                    <P>The toggle next to each joseki controls whether it is included in practice. You can enable or disable all joseki in a folder at once using the folder toggle.</P>
                    <P><B>Practicing a single joseki:</B> Tap a joseki name to open it, then tap Practice.</P>
                    <P><B>Editing a joseki:</B> Tap a joseki name to open it, then tap Edit.</P>
                    <P><B>Deleting a joseki:</B> Open the joseki and tap Delete. This cannot be undone.</P>
                    <H2>Importing and Exporting</H2>
                    <P>Use the <B>Download</B> and <B>Import</B> buttons in the top bar to back up or restore your library. Files are named JS-Custom-Library.json or JS-Default-Library.json. A copy of the default library is available at the GitHub repository.</P>
                    <P>Importing completely replaces the existing library — export a backup first. To transfer between devices without Google Drive, export on the source, transfer the file, and import on the target.</P>
                    <H2>Google Drive Sync</H2>
                    <P>Tap the <B>Drive</B> button in the top bar and select <B>Connect Google Drive</B> to sync your custom library automatically across all devices and browsers. Sign in and grant permission — the app can only access a single file it creates and cannot see anything else in your Drive.</P>
                    <P>Once connected, your library saves to Drive automatically a few seconds after any change and is fetched silently on startup. If Drive has newer data it updates automatically; if both devices have data you will be asked which version to use.</P>
                    <P>The Drive button shows the last sync time when connected, "Drive…" while syncing, and a red indicator on error. Tap it and select <B>Reconnect</B> if your session has expired (sessions last approximately one hour). Selecting <B>Disconnect</B> removes the connection from this device but does not delete your Drive data.</P>
                    <P>Only the Custom Library is synced. The Default Library and enabled/disabled toggle states for Default joseki are stored locally only. Google Drive sync requires an internet connection.</P>
                  </div>
                );

                if(tab===TABS.quiz&&!qEntry) return (
                  <div>
                    <P>The Practice Settings panel controls how practice sessions behave. Settings are saved automatically.</P>
                    <H2>Player Role</H2>
                    <P><B>Random (default)</B> — The app randomly assigns you to play the first or second color each session. <B>Player 1</B> and <B>Player 2</B> fix your role. Note joseki do not always start with Black.</P>
                    <H2>Random Node Start</H2>
                    <P>When enabled, each session begins at a randomly chosen node in the tree rather than the root — useful for drilling specific continuations. Tapping Retry picks a new random node.</P>
                    <H2>Mirror Board</H2>
                    <P>Randomly mirrors the board horizontally and/or vertically each session, training pattern recognition across all orientations. Coordinate labels in comments adjust automatically.</P>
                    <H2>Invert Colors</H2>
                    <P>Randomly swaps Black and White each session. Combined with Mirror Board, each joseki can be practiced in up to 8 orientations.</P>
                    <H2>Show Hints</H2>
                    <P>Controls whether the Hint button is available during practice. When enabled, tapping Hint shows ghost stones at all valid continuation points.</P>
                    <H2>Show Annotations</H2>
                    <P>When enabled, the app pauses after opponent moves only when the resulting position has a comment, letter annotation, or triangle marker — positions with no content auto-advance as normal. When disabled, all opponent moves auto-advance immediately.</P>
                    <H2>Scoring</H2>
                    <P>Correct moves earn points with a streak multiplier: 1× base, rising to 3× after 5+ consecutive correct moves. A wrong move resets the streak. Disable to hide scoring entirely.</P>
                  </div>
                );

                if(tab===TABS.quiz) return (
                  <div>
                    <P>Practice mode quizzes you on your selected joseki. The app plays the opponent automatically and waits for you to place your stone.</P>
                    <H2>Placing a Move</H2>
                    <P>Tap a point on the board. A correct move is accepted and the opponent responds. If the correct continuation is to play elsewhere (tenuki), tap the <B>Tenuki</B> button.</P>
                    <H2>Setup Stones</H2>
                    <P>If the joseki contains setup branches, the board may update silently before your turn — stones appear without a sound or number. These represent assumed board conditions (e.g. whether a ladder breaker is present) chosen randomly from the available setup variations.</P>
                    <H2>Wrong Moves</H2>
                    <P>A wrong move is marked in red and ghost stones show all valid continuations. Tap a ghost stone to play that continuation, or tap elsewhere to dismiss and try again from the same position.</P>
                    <H2>Hints</H2>
                    <P>If hints are enabled in settings, tap <B>Hint</B> to reveal ghost stones at all valid continuation points. Requesting a hint does not count as a wrong move.</P>
                    <H2>Tree Navigator</H2>
                    <P>Tap <B>Open Joseki Tree</B> to browse the full joseki tree. Select any node and tap <B>Start practice from here</B> to begin at that position. Retry will return to the same node.</P>
                    <H2>Opponent Moves</H2>
                    <P>The opponent plays automatically after a short pause. If Show Annotations is on and the resulting position has a comment or annotation, the app shows a ghost stone and waits for you to tap it before advancing.</P>
                    <H2>End of Joseki</H2>
                    <P>When no further continuations exist, tap <B>Retry</B> to replay the same joseki or <B>Random</B> to move to a new one.</P>
                    <H2>Switching Joseki</H2>
                    <P>If your move is valid in a different joseki in your library, the app seamlessly switches to it and continues. You are never penalized for a move that is correct in another enabled joseki.</P>
                  </div>
                );

                // Editor
                return (
                  <div>
                    <P>The Editor lets you create new joseki from scratch or modify existing ones. Changes are saved manually using the <B>Save</B> button.</P>
                    <H2>Board Tools</H2>
                    <P><B>Stone</B> — Places moves in sequence. If the position already exists as a child, the tree navigates into it.</P>
                    <P><B>Setup Black / Setup White</B> — Places setup stones that represent assumed board conditions. They do not count as moves. At non-root nodes, each change creates a setup branch (see below).</P>
                    <P><B>Tenuki</B> — Records a pass move representing a move played elsewhere on the board.</P>
                    <P><B>Mark Positions</B> — Adds letter annotations (A–Z) to board points, used with position comments to describe variations.</P>
                    <P><B>Mark Stones</B> — Adds a triangle marker to a stone on the board.</P>
                    <P><B>Undo</B> — Removes the last move (if it has no children). <B>Del Subtree</B> — Removes the current node and all descendants. Cannot be undone.</P>
                    <H2>Board View</H2>
                    <P>Full / Half / Quarter views change the display only, not the joseki data. Use Rotate to cycle orientations. Board size (9×9, 13×13, 19×19) cannot be changed after saving.</P>
                    <H2>Navigation</H2>
                    <P>Use <B>Back</B> to step back. Branch buttons below the move label navigate between alternative continuations. The expand icon (⤢) opens the full tree navigator.</P>
                    <H2>Position Comment</H2>
                    <P>Attach a text note to the current position. Displayed during practice when Show Annotations is enabled. Supports Markdown-style links: [text](url).</P>
                    <H2>Setup Branches</H2>
                    <P>Setup stones at non-root nodes create conditional variations modeling how the joseki changes when specific stones exist elsewhere (e.g. ladder breakers). Add and remove setup stones freely within a setup node; playing a move starts a new move node. In practice, setup branches are resolved silently at random before your turn.</P>
                    <H2>SGF</H2>
                    <P><B>Export SGF</B> — Saves as SGF with non-root setup stones as AB/AW/AE properties. <B>Import SGF</B> — Creates a new joseki from an SGF file, importing non-root AB/AW/AE as setup branches.</P>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      )}
      {driveConflict&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
          <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:10,width:"100%",maxWidth:400,padding:"1.4rem",boxShadow:"0 8px 32px rgba(0,0,0,0.35)"}}>
            <p style={{fontWeight:600,fontSize:"0.95rem",color:"var(--color-text-primary)",marginBottom:"0.6rem"}}>Library conflict</p>
            <p style={{fontSize:"0.82rem",color:"var(--color-text-secondary)",marginBottom:"1rem",lineHeight:1.6}}>
              Your Google Drive has a saved library. Which version would you like to use?
            </p>
            <div style={{display:"flex",flexDirection:"column",gap:"0.5rem",marginBottom:"1.1rem"}}>
              <div style={{background:"var(--color-background-secondary)",borderRadius:6,padding:"0.6rem 0.9rem",fontSize:"0.8rem",color:"var(--color-text-secondary)",display:"flex",justifyContent:"space-between"}}>
                <strong style={{color:"var(--color-text-primary)"}}>Google Drive</strong>
                <span style={{fontSize:"0.75rem"}}>{new Date(driveConflict.driveTime).toLocaleString()}</span>
              </div>
              <div style={{background:"var(--color-background-secondary)",borderRadius:6,padding:"0.6rem 0.9rem",fontSize:"0.8rem",color:"var(--color-text-secondary)",display:"flex",justifyContent:"space-between"}}>
                <strong style={{color:"var(--color-text-primary)"}}>This device</strong>
                <span style={{fontSize:"0.75rem"}}>{driveConflict.localTime>new Date(0)?new Date(driveConflict.localTime).toLocaleString():"No local data"}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:"0.5rem",justifyContent:"flex-end"}}>
              <button className="btn btnsm" onClick={function(){
                setDriveConflict(null);
                driveSaveNow(driveToken,driveFileId);
              }}>Use this device</button>
              <button className="btn btnsm" style={{background:"#4A8870",color:"#fff",borderColor:"#2E6058"}} onClick={function(){
                driveApplyData(driveConflict.driveData);
                setDriveConflict(null);
                var ts=new Date().toISOString();
                localStorage.setItem("joseki-drive-last-sync",ts); setDriveLastSync(ts);
                try{ var lsD=JSON.parse(localStorage.getItem("joseki-lab-v8")||"{}"); lsD.lastModified=ts; localStorage.setItem("joseki-lab-v8",JSON.stringify(lsD)); }catch(ex){}
              }}>Use Google Drive</button>
            </div>
          </div>
        </div>
      )}
      {confirmDialog&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}
          onClick={function(e){ if(e.target===e.currentTarget) setConfirmDialog(null); }}>
          <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:10,padding:"1.5rem",maxWidth:360,width:"90%",boxShadow:"0 8px 32px rgba(0,0,0,0.3)"}}>
            <p style={{marginBottom:"1.2rem",fontSize:"0.9rem",lineHeight:1.6}}>{confirmDialog.msg}</p>
            <div style={{display:"flex",gap:"0.5rem",justifyContent:"flex-end"}}>
              <button className="btn btnsm" onClick={function(){ setConfirmDialog(null); }}>Cancel</button>
              <button className="btn btnsm btnd" onClick={function(){ confirmDialog.onConfirm(); setConfirmDialog(null); }}>Overwrite</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
