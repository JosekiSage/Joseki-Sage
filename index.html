    .qs.correct{color:#C8A55A;}.qs.wrong{color:var(--color-text-danger);}.qs.done{color:#C8A55A;}.qs.waiting{color:var(--color-text-secondary);}
    .pt{height:3px;background:var(--color-background-secondary);border-radius:2px;margin-bottom:1rem;overflow:hidden;}
    .pf{height:100%;background:#C8A55A;border-radius:2px;transition:width 0.3s;}
    .tr{display:flex;align-items:center;gap:0.35rem;font-size:0.76rem;color:var(--color-text-secondary);margin:0.3rem 0;}
    .trow{display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;border-bottom:0.5px solid var(--color-border-tertiary);}
    .trow:last-child{border-bottom:none;}
    .tlbl{font-size:0.8rem;flex:1;}
    .toolrow{display:flex;gap:0.24rem;flex-wrap:wrap;margin-bottom:0.48rem;align-items:center;}
    .tbtn{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:0.26rem 0.56rem;font-size:0.72rem;font-family:'Noto Serif',serif;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);}
    .tbtn:hover{background:var(--color-background-tertiary);}
    .tbtn.on{background:#4A8870;color:#fff;border-color:#2E6058;}
    .treew{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:8px;overflow-x:auto;overflow-y:visible;margin-bottom:0.55rem;}
    .empty{text-align:center;padding:2.2rem 1rem;color:var(--color-text-tertiary);font-style:italic;}
    .err{color:var(--color-text-danger);font-size:0.74rem;margin-top:0.25rem;}
    .sgfp{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:0.65rem;margin-bottom:0.5rem;}
    .sect{font-size:0.72rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--color-text-secondary);margin:0.65rem 0 0.35rem;}
    .botnav{position:fixed;bottom:0;left:0;right:0;background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-secondary);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px);}
    .bottab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0.48rem 0.2rem;font-size:0.68rem;font-family:'Noto Serif',serif;color:var(--color-text-tertiary);cursor:pointer;border:none;background:transparent;gap:0.18rem;}
    .bottab.on{color:#4A8870;font-weight:600;}
    .bottab svg{width:19px;height:19px;}
    select{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:0.28rem 0.46rem;background:var(--color-background-primary);color:var(--color-text-primary);font-family:'Noto Serif',serif;font-size:0.8rem;cursor:pointer;}
    @media(max-width:560px){.ptitle{font-size:1.05rem;}.btn{font-size:0.76rem;}}
  `;

  var tools=[
    {id:"stone",label:"Stone"},{id:"setup-B",label:"Setup Black"},{id:"setup-W",label:"Setup White"},
    {id:"letter",label:"Continuations"},{id:"triangle",label:"Mark Stones"}
  ];

  function renderEntry(entry){
    return (
      <div className={"sc"+(entry.enabled===false?" dis":"")} key={entry.id}>
        <PreviewBoard entry={entry}/>
        <div className="si">
          <div className="sn">{entry.name}</div>
          <div className="sm">{entry.boardSize}x{entry.boardSize} | {countLeaves(entry.root)} var</div>
          {entry.notes&&<div className="sno">{entry.notes}</div>}
          <div className="brow">
            <button className="btn btnsm" onClick={function(){ startQuiz(entry); }}>Practice</button>
            <button className="btn btnsm" onClick={function(){ openEditor(entry); }}>Edit</button>
            <button className="btn btnsm" onClick={function(){ exportSgf(entry); }}>SGF</button>
            <button className="btn btnsm" onClick={function(){ toggleEnabled(entry.id); }}
              style={entry.enabled!==false?{background:"#4A8870",color:"#fff",borderColor:"#2E6058"}:{}}>
              {entry.enabled===false?"Off":"On"}
            </button>
            <button className="btn btnd btnsm" onClick={function(){ deleteEntry(entry.id); }}>Delete</button>
          </div>
        </div>
      </div>
    );
  }
  function renderFolder(folder, depth){
    depth=depth||0;
    var fEntries=folderEntries(folder.id);
    var subFolders=folders.filter(function(f){ return f.parentId===folder.id; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    var allOn=fEntries.every(function(e){ return e.enabled!==false; })&&subFolders.every(function(sf){
      return folderEntries(sf.id).every(function(e){ return e.enabled!==false; });
    });
    return (
      <div key={folder.id} style={{marginBottom:"0.4rem",marginLeft:depth*16}}>
        <div className="frow" onClick={function(){ toggleCollapse(folder.id); }}>
          <span style={{fontSize:"0.85rem"}}>{folder.collapsed?"[+]":"[-]"}</span>
          <span className="fname">{folder.name}</span>
          <span style={{fontSize:"0.68rem",color:"var(--color-text-tertiary)",fontFamily:"monospace"}}>{fEntries.length+subFolders.length} items</span>
          <button className="btn btnxs" onClick={function(e){ e.stopPropagation();
            setFolderEnabled(folder.id,!allOn);
            subFolders.forEach(function(sf){ setFolderEnabled(sf.id,!allOn); });
          }} style={allOn?{background:"#4A8870",color:"#fff",borderColor:"#2E6058",marginLeft:"auto"}:{marginLeft:"auto"}}>
            {allOn?"All On":"All Off"}
          </button>
          <button className="btn btnxs" onClick={function(e){ e.stopPropagation();
            setAddFolderParentId(folder.id); setNewFolderName("");
          }} title="Add subfolder">+sub</button>
          {folder.id!=="f-default"&&folder.id!=="f-custom"&&(
            <button className="btn btnxs btnd" onClick={function(e){ e.stopPropagation(); deleteFolder(folder.id); }}>X</button>
          )}
        </div>
        {!folder.collapsed&&(
          <div style={{paddingLeft:"0.75rem"}}>
            {subFolders.map(function(sf){ return renderFolder(sf,depth+1); })}
            {fEntries.length===0&&subFolders.length===0&&<p style={{fontSize:"0.76rem",color:"var(--color-text-tertiary)",padding:"0.3rem 0.5rem",fontStyle:"italic"}}>Empty folder</p>}
            {fEntries.map(function(entry){ return renderEntry(entry); })}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="app" onClick={function(){ setShowExportMenu(false); setShowImportMenu(false); }}>
      <style>{css}</style>

      <div className="topbar">
        <div className="logo">
          <svg width="26" height="26" viewBox="0 0 80 90" style={{display:"block",flexShrink:0}}>
            <rect x="30" y="2" width="20" height="5" fill="#E8E4DC"/>
            <rect x="26" y="5" width="28" height="5" fill="#E8E4DC"/>
            <rect x="12" y="8" width="56" height="8" fill="#E8E4DC"/>
            <rect x="10" y="14" width="5" height="22" fill="#E8E4DC"/>
            <rect x="65" y="14" width="5" height="22" fill="#E8E4DC"/>
            <rect x="15" y="14" width="50" height="40" fill="#C89060"/>
            <rect x="13" y="18" width="54" height="32" fill="#C89060"/>
            <rect x="12" y="22" width="23" height="23" rx="11" fill="#2A1808"/>
            <rect x="14" y="24" width="19" height="19" rx="9" fill="#1C1814"/>
            <rect x="45" y="22" width="23" height="23" rx="11" fill="#2A1808"/>
            <rect x="47" y="24" width="19" height="19" rx="9" fill="#F4F0E8"/>
            <rect x="49" y="26" width="5" height="4" rx="1" fill="white" opacity="0.7"/>
            <line x1="35" y1="33" x2="45" y2="33" stroke="#2A1808" strokeWidth="2.5"/>
            <line x1="8" y1="31" x2="12" y2="31" stroke="#2A1808" strokeWidth="2.5"/>
            <line x1="68" y1="31" x2="72" y2="31" stroke="#2A1808" strokeWidth="2.5"/>
            <rect x="12" y="18" width="22" height="5" rx="2" fill="#D0CCC4"/>
            <rect x="13" y="16" width="20" height="4" rx="2" fill="#D8D4CC"/>
            <rect x="46" y="18" width="22" height="5" rx="2" fill="#D0CCC4"/>
            <rect x="47" y="16" width="20" height="4" rx="2" fill="#D8D4CC"/>
            <rect x="36" y="42" width="8" height="5" rx="3" fill="#A87040"/>
            <rect x="26" y="49" width="18" height="3" fill="#3A1A10"/>
            <rect x="43" y="47" width="8" height="3" fill="#3A1A10"/>
            <rect x="24" y="48" width="4" height="2" fill="#3A1A10"/>
            <rect x="27" y="44" width="26" height="5" rx="2" fill="#D0CCC0"/>
            <rect x="14" y="54" width="52" height="4" fill="#E8E4DC"/>
            <rect x="13" y="57" width="54" height="4" fill="#E8E4DC"/>
            <rect x="14" y="60" width="52" height="4" fill="#E8E4DC"/>
            <rect x="16" y="63" width="48" height="4" fill="#E8E4DC"/>
            <rect x="19" y="66" width="42" height="4" fill="#E8E4DC"/>
            <rect x="22" y="69" width="36" height="4" fill="#E8E4DC"/>
            <rect x="26" y="72" width="28" height="4" fill="#E8E4DC"/>
            <rect x="30" y="75" width="20" height="3" fill="#E8E4DC"/>
            <rect x="34" y="77" width="12" height="3" fill="#E8E4DC"/>
            <rect x="37" y="79" width="6" height="3" rx="3" fill="#E8E4DC"/>
            <rect x="15" y="52" width="50" height="4" fill="#C89060"/>
          </svg>
          {" "}Joseki Sage
        </div>
        <div className="spacer"/>
        {tab===TABS.library&&(
          <span>
            <button className="btn btnxs" style={{color:"#C8BCA8",borderColor:"#5A4A30",marginRight:4}} onClick={function(){ setTab(TABS.about); }}>About</button>
            <div style={{position:"relative",display:"inline-block"}} onClick={function(e){ e.stopPropagation(); }}>
              <button className="btn btnxs" style={{color:"#C8BCA8",borderColor:"#5A4A30"}}
                onClick={function(){ setShowExportMenu(function(v){ return !v; }); setShowImportMenu(false); }}>Download</button>
              {showExportMenu&&(
                <div style={{position:"absolute",top:"110%",right:0,background:"#2A2018",border:"0.5px solid #5A4A30",borderRadius:6,zIndex:200,minWidth:180,boxShadow:"0 4px 16px rgba(0,0,0,0.4)"}}>
                  <div style={{padding:"0.3rem 0.7rem",fontSize:"0.68rem",color:"#8B7A60",borderBottom:"0.5px solid #5A4A30"}}>Choose library</div>
                  <button className="btn" style={{display:"block",width:"100%",textAlign:"left",padding:"0.4rem 0.7rem",fontSize:"0.78rem",color:"#C8BCA8",border:"none",borderRadius:0}} onClick={function(){ handleExportLib("default"); }}>Default Library</button>
                  <button className="btn" style={{display:"block",width:"100%",textAlign:"left",padding:"0.4rem 0.7rem",fontSize:"0.78rem",color:"#C8BCA8",border:"none",borderRadius:0}} onClick={function(){ handleExportLib("custom"); }}>Custom Library</button>
                </div>
              )}
            </div>
            <div style={{position:"relative",display:"inline-block",marginLeft:4}} onClick={function(e){ e.stopPropagation(); }}>
              <button className="btn btnxs" style={{color:"#C8BCA8",borderColor:"#5A4A30"}}
                onClick={function(){ setShowImportMenu(function(v){ return !v; }); setShowExportMenu(false); }}>Import</button>
              {showImportMenu&&(
                <div style={{position:"absolute",top:"110%",right:0,background:"#2A2018",border:"0.5px solid #5A4A30",borderRadius:6,zIndex:200,minWidth:180,boxShadow:"0 4px 16px rgba(0,0,0,0.4)"}}>
                  <div style={{padding:"0.3rem 0.7rem",fontSize:"0.68rem",color:"#8B7A60",borderBottom:"0.5px solid #5A4A30"}}>Choose library</div>
                  <button className="btn" style={{display:"block",width:"100%",textAlign:"left",padding:"0.4rem 0.7rem",fontSize:"0.78rem",color:"#C8BCA8",border:"none",borderRadius:0}} onClick={function(){ setConfirmDialog({msg:"This will overwrite the entire Default Library. This cannot be undone. Continue?",onConfirm:function(){ importDefaultRef.current&&importDefaultRef.current.click(); }}); setShowImportMenu(false); }}>Default Library</button>
                  <button className="btn" style={{display:"block",width:"100%",textAlign:"left",padding:"0.4rem 0.7rem",fontSize:"0.78rem",color:"#C8BCA8",border:"none",borderRadius:0}} onClick={function(){ setConfirmDialog({msg:"This will overwrite the entire Custom Library. This cannot be undone. Continue?",onConfirm:function(){ importCustomRef.current&&importCustomRef.current.click(); }}); setShowImportMenu(false); }}>Custom Library</button>
                </div>
              )}
            </div>
            <input ref={importDefaultRef} type="file" accept=".json" style={{display:"none"}} onChange={function(e){ handleImportFile(e,"default"); }}/>
            <input ref={importCustomRef} type="file" accept=".json" style={{display:"none"}} onChange={function(e){ handleImportFile(e,"custom"); }}/>
            <button className="btn btnp btnsm" onClick={function(){ openEditor(null); }}>+ New</button>
          </span>
        )}
        {tab===TABS.editor&&(
          <button className="btn btnp btnsm" onClick={handleSaveEntry} disabled={!editName.trim()}>
            {saveFlash?"Saved!":"Save"}
          </button>
        )}
      </div>

      {tab===TABS.library&&(
        <div className="con">
          <p className="ptitle">Joseki Library</p>
          <p className="psub">Toggle On/Off to include in quiz pool.</p>
          {fetching&&(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"2.5rem 1rem",gap:"1rem"}}>
              <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                <circle cx="18" cy="18" r="15" stroke="var(--color-border-secondary)" strokeWidth="3"/>
                <path d="M18 3 a15 15 0 0 1 15 15" stroke="#4A8870" strokeWidth="3" strokeLinecap="round">
                  <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="0.9s" repeatCount="indefinite"/>
                </path>
              </svg>
              <p style={{fontSize:"0.88rem",color:"var(--color-text-secondary)",fontStyle:"italic"}}>Loading default library...</p>
            </div>
          )}
          {!fetching&&(<span>
          <div style={{display:"flex",gap:"0.35rem",marginBottom:"0.75rem",flexWrap:"wrap"}}>
            <input className="inp" style={{marginBottom:0,flex:1,minWidth:120}} placeholder="New folder name"
              value={newFolderName} onChange={function(e){ setNewFolderName(e.target.value); }}
              onKeyDown={function(e){ if(e.key==="Enter") addFolder(); }}/>
            <select value={addFolderParentId||""} onChange={function(e){ setAddFolderParentId(e.target.value||null); }}
              style={{fontSize:"0.75rem"}}>
              <option value="">Top level</option>
              {folders.map(function(f){ return <option key={f.id} value={f.id}>{f.name}</option>; })}
            </select>
            <button className="btn btnsm" onClick={addFolder} disabled={!newFolderName.trim()}>+ Folder</button>
          </div>
          {folders.filter(function(f){ return !f.parentId; }).sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(folder){ return renderFolder(folder,0); })}
          {unfoldered.map(function(entry){ return renderEntry(entry); })}
          {entries.length===0&&!fetching&&<div className="empty">No josekis yet. Tap "+ New".</div>}
          </span>)}
        </div>
      )}

      {tab===TABS.quiz&&(
        <div className="con">
          {!qEntry?(
            <div>
              <p className="ptitle">Practice</p>

              <div className="card">
                <p className="sect">Transformations</p>
<div className="trow"><span className="tlbl">Random mirror each quiz</span><Toggle checked={qSettings.mirrorRandom} onChange={function(v){ setSetting("mirrorRandom",v); }}/></div>
                <div className="trow"><span className="tlbl">Randomly invert colors</span><Toggle checked={qSettings.invertRandom} onChange={function(v){ setSetting("invertRandom",v); }}/></div>
                <p className="sect">Display</p>
                <div className="trow"><span className="tlbl">Show scoring</span><Toggle checked={qSettings.showScoring} onChange={function(v){ setSetting("showScoring",v); }}/></div>
                <div className="trow"><span className="tlbl">Show letter continuations</span><Toggle checked={qSettings.showContinuations} onChange={function(v){ setSetting("showContinuations",v); }}/></div>
                <div className="trow"><span className="tlbl">Show marked stones</span><Toggle checked={qSettings.showMarkers} onChange={function(v){ setSetting("showMarkers",v); }}/></div>
                <div className="trow"><span className="tlbl">Show position comment<span style={{fontSize:"0.65rem",color:"var(--color-text-tertiary)",fontStyle:"italic",display:"block"}}>Disabling leads to faster play</span></span><Toggle checked={qSettings.showComments} onChange={function(v){ setSetting("showComments",v); }}/></div>
              </div>
              <button className="btn btnp" style={{width:"100%",padding:"0.5rem",marginBottom:"1rem"}}
                onClick={startRandom} disabled={!enabledEntries.length}>
                Start random ({enabledEntries.length} enabled)
              </button>

            </div>
          ):(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:"0.45rem",marginBottom:"0.65rem"}}>
                <div>
                  <div className={"qs "+qStatus}>
                    {qStatus==="done"&&("Sequence complete: "+qScore.c+" correct, "+qScore.w+" wrong"+(qSettings.showScoring?(" -- "+qSession.points+" pts"):""))}
                  </div>
                </div>
                <div style={{display:"flex",gap:"0.28rem",alignItems:"center",flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  {qSettings.showScoring&&(
                    <div style={{display:"flex",alignItems:"center",gap:"0.4rem"}}>
                      <div style={{
                        background:"linear-gradient(135deg,#C8A55A,#A88040)",
                        borderRadius:"8px",padding:"0.18rem 0.6rem",
                        display:"flex",alignItems:"baseline",gap:"0.2rem",
                        boxShadow:"0 1px 6px rgba(200,165,90,0.4)"
                      }}>
                        <span style={{fontSize:"1.1rem",fontWeight:700,color:"#fff",fontFamily:"monospace",letterSpacing:"-0.02em"}}>{qSession.points}</span>
                        <span style={{fontSize:"0.58rem",color:"rgba(255,255,255,0.8)",fontFamily:"monospace"}}>pts</span>
                      </div>
                      {qSession.streak>1&&(
                        <div style={{
                          background:"linear-gradient(135deg,#4A8870,#2E6058)",
                          borderRadius:"8px",padding:"0.18rem 0.45rem",
                          boxShadow:"0 1px 6px rgba(74,136,112,0.4)"
                        }}>
                          <span style={{fontSize:"0.78rem",fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{"x"+Math.min(1+qSession.streak*0.5,3).toFixed(1)}</span>
                        </div>
                      )}
                      <span style={{fontSize:"0.7rem",color:"var(--color-text-tertiary)",fontFamily:"monospace"}}>
                        {qSession.totalC+qSession.totalW>0?(Math.round(100*qSession.totalC/(qSession.totalC+qSession.totalW))+"%"):"--"}
                      </span>
                    </div>
                  )}
                  <button className="btn btnxs" onClick={function(){ startQuiz(qEntry); }}>Retry</button>
                  <button className="btn btnxs" onClick={function(){
                    var next=enabledEntries[Math.floor(Math.random()*enabledEntries.length)];
                    setQSession(function(ss){ return ss; });
                    startQuiz(next);
                  }} disabled={enabledEntries.length<=1}>Random</button>
                  <button className="btn btnxs" onClick={function(){ setQEntry(null); }}>X</button>
                </div>
              </div>
              <div className="pt"><div className="pf" style={{width:(Math.min(qDepth/8,1)*100)+"%"}}/></div>
              <div ref={boardRef} style={{width:"100%",marginBottom:"0.65rem"}}>
                <div className="bshadow" style={{display:"inline-block"}}>
                  <CroppedBoard size={qEntry.boardSize}
                    bbox={(function(){
                      var b=treeBoundingBox(qRoot);
                      // Extend bbox to include all hint/continuation positions
                      qWrongContinuations.forEach(function(m){
                        if(!b){ b={minR:m.r,maxR:m.r,minC:m.c,maxC:m.c}; return; }
                        if(m.r<b.minR) b.minR=m.r; if(m.r>b.maxR) b.maxR=m.r;
                        if(m.c<b.minC) b.minC=m.c; if(m.c>b.maxC) b.maxC=m.c;
                      });
                      return b;
                    })()}
                    stones={qStones}
                    onPlace={handleQuizBoardClick}
                    lastMove={qPath.length>0?nodeAtPath(qRoot,qPath).move:null}
                    hintStones={qWrongContinuations}
                    wrongStone={qWrong}
                    pendingStone={qPendingOpp?qPendingOpp.move:null}
                    showCoords={true}
                    annotations={qAnnotations}
                    nextColor={qNextMoveColor}
                    noHover={!!qPendingOpp||qStatus==="review"||qStatus==="done"}/>
                </div>
              </div>
              <p style={{fontSize:"0.71rem",color:"var(--color-text-tertiary)",marginBottom:"0.55rem"}}>
                Playing as {qPlayerColor==="B"?"Black":"White"} (randomly assigned)
                {qStatus==="done"?" -- tap board to replay":""}
              </p>

              <div style={{display:"flex",gap:"0.3rem",flexWrap:"wrap",marginBottom:"0.65rem"}}>
                {(qStatus==="waiting"&&qIsPlayer&&qNode&&qNode.children.length>0)&&(
                  <button className="btn btnsm" onClick={function(){
                    if(qHint){ setQHint(false); setQWrongContinuations([]); }
                    else {
                      var kids=qNode?qNode.children||[]:[];
                      setQWrongContinuations(buildWrongContinuations(kids));
                      setQHint(true);
                    }
                  }}>{qHint?"Hide hint":"Hint"}</button>
                )}
              {(qStatus==="waiting"&&qIsPlayer&&qNode&&(qNode.children||[]).some(function(ch){ return ch.move&&ch.move.pass&&ch.move.color===qPlayerColor; }))&&(
                  <button className="btn btnsm" onClick={function(){
                    setQTenuki(true);
                    handleQuizBoardClick(-1,-1);
                  }}>Tenuki</button>
                )}
                {qStatus==="review"&&(
                  <span style={{display:"flex",gap:"0.28rem",flexWrap:"wrap"}}>
                    <button className="btn btnsm" onClick={function(){
                      setQWrongContinuations([]); setQHint(false);
                      startQuiz(qEntry);
                    }}>Restart</button>
                    {enabledEntries.length>1&&(
                      <button className="btn btnsm" onClick={function(){
                        setQWrongContinuations([]); setQHint(false);
                        var next=enabledEntries[Math.floor(Math.random()*enabledEntries.length)];
                        setQSession(function(ss){ return ss; }); // keep session
                        startQuiz(next);
                      }}>Random</button>
                    )}
                  </span>
                )}
              </div>
              {(qSettings.showComments&&qCurComment)&&(
                <div className="card" style={{borderColor:"#b5a060",marginBottom:"0.55rem"}}>
                  <span className="lbl" style={{marginBottom:"0.22rem"}}>Position note</span>
                  <p style={{fontSize:"0.79rem",fontStyle:"italic",color:"var(--color-text-secondary)",lineHeight:1.55}}>{qCurComment.replace(/[Ss]ee\s*\.\s*/g,"").replace(/\s{2,}/g," ").trim()}</p>
                </div>
              )}

            </div>
          )}
        </div>
      )}

      {tab===TABS.editor&&(
        <div className="con">
          <p className="ptitle">{editId?"Edit joseki":"New joseki"}</p>
          <input className="inp" placeholder="Name (required)" value={editName} onChange={function(e){ setEditName(e.target.value); }}/>
          <textarea className="inp ta" style={{minHeight:40}} placeholder="Notes (optional)" value={editNotes} onChange={function(e){ setEditNotes(e.target.value); }}/>
          <div style={{display:"flex",alignItems:"center",gap:"0.45rem",marginBottom:"0.48rem"}}>
            <span className="lbl" style={{marginBottom:0}}>Folder:</span>
            <select value={editFolderId||""} onChange={function(e){ setEditFolderId(e.target.value||null); }}>
              <option value="">Uncategorised</option>
              {folders.map(function(f){
                var depth=0,p=f;
                while(p.parentId){ var par=folders.find(function(x){ return x.id===p.parentId; }); if(!par) break; depth++; p=par; }
                var prefix=""; for(var d=0;d<depth;d++) prefix+="-- ";
                return <option key={f.id} value={f.id}>{prefix+f.name}</option>;
              })}
            </select>
          </div>
          <div className="toolrow">
            {tools.map(function(t){
              return <button key={t.id} className={"tbtn"+(editTool===t.id?" on":"")} onClick={function(){ setEditTool(t.id); }}>{t.label}</button>;
            })}
            <button className="tbtn" onClick={handlePass} title="Pass/Tenuki">Pass/Tenuki</button>
            <div style={{marginLeft:"auto",display:"flex",gap:"0.22rem",alignItems:"center"}}>
              <select value={editSize} onChange={function(e){ setEditSize(Number(e.target.value)); setEditRoot(rootNode()); setEditPath([]); }}>
                <option value={9}>9x9</option><option value={13}>13x13</option><option value={19}>19x19</option>
              </select>
              <button className={"tbtn"+(editShowNums?" on":"")} onClick={function(){ setEditShowNums(function(v){ return !v; }); }}>123</button>
              <select value={editView} onChange={function(e){
                var newView=e.target.value;
                setEditView(newView);
                if(newView==="full"){ setEditViewRot(0); return; }
                // Auto-select rotation containing the stones
                var bbox=treeBoundingBox(editRoot);
                if(!bbox){ setEditViewRot(0); return; }
                var midR=(bbox.minR+bbox.maxR)/2;
                var midC=(bbox.minC+bbox.maxC)/2;
                var half=editSize/2;
                var inBottom=midR>=half, inRight=midC>=half;
                if(newView==="half"){
                  // rot 0,1 = bottom rows; rot 2,3 = top rows
                  setEditViewRot(inBottom?0:2);
                } else {
                  // quarter: rot 0=BR, 1=BL, 2=TL, 3=TR
                  setEditViewRot(inBottom?(inRight?0:1):(inRight?3:2));
                }
              }} style={{fontSize:"0.72rem",padding:"0.2rem 0.35rem"}}>
                <option value="full">Full</option>
                <option value="half">Half</option>
                <option value="quarter">Quarter</option>
              </select>
              {editView!=="full"&&<button className="tbtn" onClick={function(){ setEditViewRot(function(r){ return (r+1)%4; }); }}>Rotate</button>}
            </div>
          </div>
          <div style={{display:"flex",gap:"0.22rem",flexWrap:"wrap",marginBottom:"0.45rem"}}>
            <button className="btn btnsm" onClick={handleBack} disabled={!editPath.length}>Back</button>
            <button className="btn btnsm" onClick={handleUndoLeaf} disabled={!editPath.length||!editNode||editNode.children.length>0}>Undo</button>
            <button className="btn btnsm btnd" onClick={handleDeleteSubtree} disabled={!editPath.length}>Del subtree</button>
            <button className="btn btnsm" style={{marginLeft:"auto"}} onClick={handleSgfExport}>Export SGF</button>
            <button className="btn btnsm" onClick={function(){ sgfImportRef.current&&sgfImportRef.current.click(); }}>Import SGF</button>
          </div>
          <input ref={sgfImportRef} type="file" accept=".sgf,.txt" style={{display:"none"}} onChange={handleSgfFile}/>
          {sgfErr&&<p className="err" style={{marginBottom:"0.3rem"}}>{sgfErr}</p>}
          {(editNode&&editNode.children.length>0)&&(
            <div style={{display:"flex",gap:"0.2rem",flexWrap:"wrap",marginBottom:"0.38rem",alignItems:"center"}}>
              {editNode.children.map(function(ch,i){
                var isActive=editPath.length>0&&editPath[editPath.length-1]===i;
                var lbl=ch.move?(ch.move.pass?(ch.move.color+" pass"):coord(ch.move.r,ch.move.c,editSize)):"N"+i;
                var isBlack=ch.move&&ch.move.color==="B";
                var btnBg=isBlack?"#1C1814":"#F0EDE5";
                var btnColor=isBlack?"#F0EDE5":"#1C1814";
                var btnBorder=isActive?(isBlack?"#6BAA8E":"#4A8870"):(isBlack?"#3A2E20":"#8B7A60");
                var btnOutline=isActive?("2px solid "+(isBlack?"#6BAA8E":"#4A8870")):"none";
                return <button key={i} className="tbtn" style={{background:btnBg,color:btnColor,borderColor:btnBorder,outline:btnOutline,outlineOffset:"1px"}}
                  onClick={function(){ setEditPath(function(p){ return p.concat(i); }); }}>{lbl}</button>;
              })}
            </div>
          )}
          <div ref={boardRef} style={{display:"flex",gap:"1rem",flexWrap:"wrap",alignItems:"flex-start"}}>
            <div>
              <div className="bshadow" style={{display:"inline-block"}}>
                <ScaledBoard size={editSize} stones={editStones}
                  onPlace={handleBoardClick}
                  lastMove={editNode?editNode.move:null}
                  flipped={editFlipped} showCoords={true}
                  branchPoints={editBranches}
                  annotations={editAnnotations}
                  showNumbers={editShowNums}
                  nextColor={editTurn}
                  viewMode={editView} viewRot={editViewRot}/>
              </div>
              <div className="tr">
                <span style={{width:8,height:8,borderRadius:"50%",background:editTurn==="B"?"#1C1814":"#F0EDE5",border:editTurn==="B"?"none":"1px solid #C4BAA8",display:"inline-block",flexShrink:0}}/>
                {(editTool==="setup-B"||editTool==="setup-W")
                  ?("Setup mode -- first move: "+(editTurn==="B"?"Black":"White")+ "(Pass/Tenuki to swap)")
                  :editTool==="letter"?(letterCount>=26?"Continuation limit (26 max)":"Click to add continuation")
                  :editTool==="triangle"?"Click to mark/unmark stone"
                  :(editTurn==="B"?"Black to play":"White to play")}
              </div>
            </div>
            <div style={{flex:1,minWidth:170}}>
              <span className="lbl">Tree -- tap to navigate</span>
              <div className="treew">
                <TreeDiagram root={editRoot} currentPath={editPath} boardSize={editSize}
                  onNavigate={function(path){ navigateTo(path); }}/>
              </div>
              <span className="lbl" style={{marginTop:"0.45rem"}}>Position comment</span>
              <textarea className="inp ta" style={{minHeight:50,marginBottom:"0.22rem"}}
                placeholder="Auto-saved as you type"
                value={editNode?editNode.comment:""}
                onChange={function(e){ handleCommentChange(e.target.value); }}/>
            </div>
          </div>
        </div>
      )}

      <nav className="botnav">
        <button className={"bottab"+(tab===TABS.library?" on":"")} onClick={function(){ setTab(TABS.library); }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          Library
        </button>
        <button className={"bottab"+(tab===TABS.quiz?" on":"")} onClick={function(){ setQEntry(null); setTab(TABS.quiz); }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M8.5 8.5a3.8 3.8 0 1 1 5 3.54C12.5 13 12 13.8 12 15" strokeLinecap="round"/>
            <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
          Practice
        </button>
        <button className={"bottab"+(tab===TABS.editor?" on":"")} onClick={function(){ openEditor(null); }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New
        </button>
      </nav>

              <div style={{fontSize:"2rem",fontWeight:700,letterSpacing:"-0.03em",lineHeight:1}}>Joseki Sage</div>
              <div style={{fontSize:"0.82rem",color:"var(--color-text-tertiary)",fontStyle:"italic",marginTop:2}}>A Go joseki training tool</div>

                    {/* About */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">About</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              Joseki Sage is a browser-based Go joseki training application. It allows you to
              build and organize a personal library of joseki sequences, study them in an
              interactive editor, and test your recall in practice mode, which quizzes you
              on correct continuations, tracks your score and accuracy across sessions, and
              supports mirroring and color inversion to train pattern recognition from any orientation.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.75rem"}}>
              The app runs entirely in your browser as a single HTML file with no server
              required. Your library is stored locally in your browser and can be exported
              and imported as JSON files.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.75rem"}}>
              This app was vibe coded with AI due to my lacking the technical skills to create it myself
              and no existing application having the desired functionality. If you have understandable
              moral or practical objections to using an application created in this way, then you may
              want to look for an alternative.
            </p>
          </div>

          {/* How to use */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">How to Use</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}><strong>Library</strong> - Browse, organise, enable or disable joseki for practice. Import the default library via the Download/Import menu in the top bar. Use the folder structure to keep josekis organised between Default and Custom libraries.</p>
              <p style={{marginBottom:"0.6rem"}}><strong>Practice</strong> - Select joseki in the library and tap Practice, or use the start button in the Practice tab. The app randomly assigns you to play the first or second move of each sequence. Correct continuations are scored; wrong moves reveal valid alternatives. Settings allow mirroring, color inversion, and toggling of hints and comments.</p>
              <p style={{marginBottom:"0.6rem"}}><strong>New / Editor</strong> - Create joseki from scratch or edit existing ones. Place stones, add setup stones, annotate continuations with letters or markers, and write position comments. Import and export individual joseki as SGF files.</p>
              <p><strong>Scoring</strong> - Points are awarded per correct move, multiplied by a streak bonus (up to 3x at 5 consecutive correct moves). Accuracy is tracked as a percentage across the session. Scoring can be disabled in practice settings.</p>
            </div>
          </div>

            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>

                Inspired by <a href="https://joseki.cat" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>Joseki.cat</a>, an excellent joseki trainer without which this app would not exist.
              </p>
              <p style={{marginBottom:"0.6rem"}}>
                Default library data sourced from the <a href="https://online-go.com/joseki" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>OGS Joseki Explorer</a>, a community-maintained database of Go joseki sequences. Used with appreciation for the Go community's open contribution. Full credit for all the valuable information belongs to the contributors; any errors can be attributed to me.
              </p>
              <p>
                Stone placement and capture sounds from <a href="https://github.com/SabakiHQ/Sabaki" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>Sabaki</a> by Yichuan Shen (Copyright 2015-2022), used under the MIT licence. The MIT licence requires that this copyright notice be reproduced: Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated files to deal in the software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies, subject to the above copyright notice and this permission notice being included in all copies or substantial portions.

        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
