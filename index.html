<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;


const CELL=34, PAD=26;
const COLS="ABCDEFGHJKLMNOPQRST";
// Remap Go coordinate references in text to match board transform.
// mH=mirror horizontal, mV=mirror vertical (same transforms applied to the board).
function remapCoords(text,mH,mV,boardSize){
  if(!text||(!mH&&!mV)) return text;
  return text.replace(/\b([A-HJ-T])(\d{1,2})\b/gi,function(match,col,rowStr){
    var cu=col.toUpperCase();
    var ci=COLS.indexOf(cu); if(ci===-1) return match;
    var r=boardSize-parseInt(rowStr,10);
    if(r<0||r>=boardSize) return match;
    var nc=mH?boardSize-1-ci:ci;
    var nr=mV?boardSize-1-r:r;
    return COLS[nc]+(boardSize-nr);
  });
}

const STAR19=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
const STAR9=[[2,2],[2,6],[4,4],[6,2],[6,6]];
const STAR13=[[3,3],[3,9],[6,6],[9,3],[9,9]];
const STORAGE_KEY="joseki-lab-v8";
const ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function sk(r,c){ return r+","+c; }
function coord(r,c,size){ return COLS[c]+(size-r); }

function copyToClipboard(text, onDone){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ if(onDone) onDone(); }).catch(function(){ if(onDone) onDone(); });
  } else {
    if(onDone) onDone();
  }
}
function downloadBlob(text, filename, mime){
  try{
    mime = mime || "text/plain";
    var blob = new Blob([text], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }catch(err){
    // Fallback: open as data URI in new tab
    try{
      var dataUri="data:"+(mime||"text/plain")+";charset=utf-8,"+encodeURIComponent(text);
      window.open(dataUri,"_blank");
    }catch(e2){}
  }
}

// Node structure
let _nid=1;
function makeNode(move){
  return{id:_nid++, move:move||null, comment:"", children:[], setupStones:{}, annotations:[], colorOffset:0};
}
function rootNode(){ return makeNode(null); }
function deepClone(n){
  if(!n) return null;
  return{
    id:n.id, move:n.move?{...n.move}:null,
    comment:n.comment, colorOffset:n.colorOffset||0,
    flagged:n.flagged||false,
    setupStones:{...n.setupStones},
    annotations:n.annotations.map(function(a){ return{...a}; }),
    children:n.children.map(deepClone)
  };
}

// -- Go capture logic ---------------------------------------------------------
function getGroup(stones,r,c,size){
  var color=stones[sk(r,c)]?stones[sk(r,c)].color:null;
  if(!color) return null;
  var group=[],visited={},stack=[{r:r,c:c}];
  while(stack.length){
    var pos=stack.pop(),k=sk(pos.r,pos.c);
    if(visited[k]) continue; visited[k]=true;
    if(!stones[k]||stones[k].color!==color) continue;
    group.push(k);
    [[pos.r-1,pos.c],[pos.r+1,pos.c],[pos.r,pos.c-1],[pos.r,pos.c+1]].forEach(function(nb){
      if(nb[0]>=0&&nb[0]<size&&nb[1]>=0&&nb[1]<size) stack.push({r:nb[0],c:nb[1]});
    });
  }
  return group;
}
function getLiberties(stones,group,size){
  var libs={};
  group.forEach(function(k){
    var p=k.split(","),r=Number(p[0]),c=Number(p[1]);
    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(function(nb){
      if(nb[0]>=0&&nb[0]<size&&nb[1]>=0&&nb[1]<size&&!stones[sk(nb[0],nb[1])]) libs[sk(nb[0],nb[1])]=true;
    });
  });
  return Object.keys(libs).length;
}
function applyMove(stones,r,c,color,size){
  var next={};
  Object.keys(stones).forEach(function(k){ next[k]={color:stones[k].color,moveNum:stones[k].moveNum}; });
  next[sk(r,c)]={color:color,moveNum:null};
  var captured=0,opp=color==="B"?"W":"B";
  [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(function(nb){
    var nr=nb[0],nc=nb[1]; if(nr<0||nr>=size||nc<0||nc>=size) return;
    var nk=sk(nr,nc); if(!next[nk]||next[nk].color!==opp) return;
    var group=getGroup(next,nr,nc,size);
    if(getLiberties(next,group,size)===0){ captured+=group.length; group.forEach(function(k){ delete next[k]; }); }
  });
  return {stones:next,captured:captured};
}

// Walk all nodes in a tree and collect bounding box of all stones/moves
function treeBoundingBox(root){
  var minR=99,maxR=0,minC=99,maxC=0,found=false;
  function add(r,c){ found=true; if(r<minR)minR=r; if(r>maxR)maxR=r; if(c<minC)minC=c; if(c>maxC)maxC=c; }
  // Setup stones at root
  Object.keys(root.setupStones||{}).forEach(function(k){
    var p=k.split(","); add(Number(p[0]),Number(p[1]));
  });
  function walk(node){
    if(node.move&&!node.move.pass) add(node.move.r,node.move.c);
    node.children.forEach(walk);
  }
  walk(root);
  if(!found) return null;
  return {minR:minR,maxR:maxR,minC:minC,maxC:maxC};
}

function nodeAtPath(root,path){
  var n=root;
  for(var i=0;i<path.length;i++){
    if(!n||!n.children[path[i]]) return null;
    n=n.children[path[i]];
  }
  return n;
}

function stateAlongPath(root,path){
  // Derive board size from root (default 19)
  var size=root._boardSize||19;
  var stones={};
  var setup=root.setupStones||{};
  Object.keys(setup).forEach(function(k){ stones[k]={color:setup[k],moveNum:null}; });
  var n=root, moveNum=0;
  if(n.move && !n.move.pass){
    moveNum++;
    var r1=applyMove(stones,n.move.r,n.move.c,n.move.color,size);
    // Preserve moveNum for the placed stone
    stones=r1.stones; stones[sk(n.move.r,n.move.c)].moveNum=moveNum;
  } else if(n.move && n.move.pass){ moveNum++; }
  for(var i=0;i<path.length;i++){
    n=n.children[path[i]];
    if(!n) break;
    if(n.move && !n.move.pass){
      moveNum++;
      var r2=applyMove(stones,n.move.r,n.move.c,n.move.color,size);
      stones=r2.stones; stones[sk(n.move.r,n.move.c)].moveNum=moveNum;
    } else if(n.move && n.move.pass){ moveNum++; }
  }
  return {stones:stones, moveCount:moveNum};
}

function turnAtPath(root,path){
  var mc=stateAlongPath(root,path).moveCount;
  return ((mc+(root.colorOffset||0))%2===0)?"B":"W";
}

function depthAtPath(root,path){
  var n=root, d=n.move?1:0;
  for(var i=0;i<path.length;i++){
    n=n.children[path[i]];
    if(!n) break;
    if(n.move) d++;
  }
  return d;
}

function commentAtPath(root,path){
  var n=nodeAtPath(root,path);
  return n?n.comment||"":root.comment||"";
}

function countLeaves(n){
  if(!n||!n.children.length) return 1;
  return n.children.reduce(function(a,c){ return a+countLeaves(c); },0);
}
function countNodes(n){
  if(!n) return 0;
  return 1+n.children.reduce(function(a,c){ return a+countNodes(c); },0);
}

// SGF
function sgfC(r,c){ return String.fromCharCode(97+c)+String.fromCharCode(97+r); }
function parseSgfC(s,size){
  if(!s||s==="tt") return null;
  var c=s.charCodeAt(0)-97, r=s.charCodeAt(1)-97;
  if(c<0||r<0||c>=size||r>=size) return null;
  return {r:r,c:c};
}
function nodeToSgf(node,size){
  // Emit a single node's properties (no parens, no semicolon)
  var s="";
  if(node.move){
    var cl=node.move.color;
    s+=cl+(node.move.pass?"[]":"["+sgfC(node.move.r,node.move.c)+"]");
  }
  if(node.comment) s+="C["+node.comment.replace(/\]/g,"\\]")+"]";
  return s;
}
function seqToSgf(node,size){
  // Emit this node and its linear descendants as a sequence of ;node entries,
  // branching when there are multiple children.
  var s=";"+nodeToSgf(node,size);
  if(node.children.length===0) return s;
  if(node.children.length===1) return s+seqToSgf(node.children[0],size);
  // Multiple children: each becomes a variation
  node.children.forEach(function(ch){
    s+="("+seqToSgf(ch,size)+")";
  });
  return s;
}
function treeToSgf(root,size){
  // Root node holds game info and optional setup stones
  var s="(;GM[1]FF[4]SZ["+size+"]AP[JosekiSage]";
  var setupKeys=Object.keys(root.setupStones||{});
  var ab=setupKeys.filter(function(k){ return root.setupStones[k]==="B"; });
  var aw=setupKeys.filter(function(k){ return root.setupStones[k]==="W"; });
  if(ab.length) s+="AB"+ab.map(function(k){ var p=k.split(","); return "["+sgfC(Number(p[0]),Number(p[1]))+"]"; }).join("");
  if(aw.length) s+="AW"+aw.map(function(k){ var p=k.split(","); return "["+sgfC(Number(p[0]),Number(p[1]))+"]"; }).join("");
  if(root.comment) s+="C["+root.comment.replace(/\]/g,"\\]")+"]";
  // Children of root
  if(root.children.length===0){ s+=")"; return s; }
  if(root.children.length===1){ s+=seqToSgf(root.children[0],size); }
  else root.children.forEach(function(ch){ s+="("+seqToSgf(ch,size)+")"; });
  s+=")";
  return s;
}
function parseSgf(txt){
  txt=txt.trim();
  var pos=0, boardSize=19;
  function skip(){ while(pos<txt.length && /\s/.test(txt[pos])) pos++; }
  function con(){ return txt[pos++]; }
  function propVal(){
    var vs=[];
    while(pos<txt.length && txt[pos]==="["){
      con(); var v="", esc=false;
      while(pos<txt.length){
        var ch=con();
        if(esc){ v+=ch; esc=false; }
        else if(ch==="\\"){ esc=true; }
        else if(ch==="]") break;
        else v+=ch;
      }
      vs.push(v);
    }
    return vs;
  }
  function parseProps(){
    var ps=[]; skip();
    while(pos<txt.length && /[A-Z]/.test(txt[pos])){
      var p="";
      while(pos<txt.length && /[A-Z]/.test(txt[pos])) p+=con();
      skip(); ps.push({p:p,vs:propVal()}); skip();
    }
    return ps;
  }
  function parseSeq(){
    var nodes=[]; skip();
    while(pos<txt.length && txt[pos]!==")" && txt[pos]!=="("){
      if(txt[pos]===";"){con(); nodes.push(parseProps()); skip();}
      else con();
    }
    var vars=[]; skip();
    while(pos<txt.length && txt[pos]==="("){
      con(); vars.push(parseSeq()); skip();
      if(pos<txt.length && txt[pos]===")"){con(); skip();}
    }
    if(!nodes.length) return null;
    nodes[0].forEach(function(pv){ if(pv.p==="SZ") boardSize=parseInt(pv.vs[0])||19; });
    function pn(ps){
      var n=makeNode(null);
      ps.forEach(function(pv){
        if(pv.p==="B"||pv.p==="W"){
          var rc=parseSgfC(pv.vs[0],boardSize);
          n.move=rc?{r:rc.r,c:rc.c,color:pv.p}:{pass:true,color:pv.p};
        }
        if(pv.p==="C") n.comment=pv.vs[0]||"";
      });
      return n;
    }
    var chain=nodes.map(pn);
    for(var i=0;i<chain.length-1;i++) chain[i].children.push(chain[i+1]);
    vars.forEach(function(v){ if(v) chain[chain.length-1].children.push(v); });
    return chain[0];
  }
  var si=txt.indexOf("(");
  if(si===-1) return {root:rootNode(),boardSize:19};
  pos=si+1;
  return {root:parseSeq()||rootNode(), boardSize:boardSize};
}

// Persistence
function saveLib(data){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }catch(e){} }
function loadLib(){ try{ var r=localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function parseImport(txt){
  var obj=JSON.parse(txt);
  var lib=Array.isArray(obj)?obj:(obj.library||obj.entries);
  var fols=(!Array.isArray(obj)&&obj.folders)||[];
  if(!Array.isArray(lib)) throw new Error("No library array");
  return {entries:lib, folders:fols};
}

// Transformations
function mirrorTree(node,size,mH,mV){
  if(!node) return null;
  function mr(r){ return mV?size-1-r:r; }
  function mc(c){ return mH?size-1-c:c; }
  function mm(m){ if(!m) return m; if(m.pass) return m; return {r:mr(m.r),c:mc(m.c),color:m.color}; }
  function ms(s){ var o={}; Object.keys(s).forEach(function(k){ var p=k.split(","); o[sk(mr(Number(p[0])),mc(Number(p[1])))]=s[k]; }); return o; }
  function ma(a){ return {r:mr(a.r),c:mc(a.c),type:a.type,label:a.label}; }
  return {
    id:node.id, move:mm(node.move), comment:node.comment, colorOffset:node.colorOffset||0,
    setupStones:ms(node.setupStones||{}),
    annotations:(node.annotations||[]).map(ma),
    children:node.children.map(function(ch){ return mirrorTree(ch,size,mH,mV); })
  };
}
function invertTree(node){
  if(!node) return null;
  function inv(c){ return c==="B"?"W":"B"; }
  function mm(m){ if(!m) return m; return {r:m.r,c:m.c,color:inv(m.color),pass:m.pass}; }
  function ms(s){ var o={}; Object.keys(s).forEach(function(k){ o[k]=inv(s[k]); }); return o; }
  return {
    id:node.id, move:mm(node.move), comment:node.comment, colorOffset:node.colorOffset||0,
    setupStones:ms(node.setupStones||{}),
    annotations:node.annotations||[],
    children:node.children.map(invertTree)
  };
}

// Tree diagram component
function TreeDiagram(props){
  var root=props.root, currentPath=props.currentPath, onNavigate=props.onNavigate, boardSize=props.boardSize;
  var zoom=props.zoom||1;
  var NW=Math.round(52*zoom), NH=Math.round(52*zoom), PX=Math.round(16*zoom), PY=Math.round(12*zoom);
  function assignY(node,offset){
    if(!node.children.length){ node._y=offset; return offset+1; }
    var cur=offset;
    node.children.forEach(function(ch){ cur=assignY(ch,cur); });
    node._y=(node.children[0]._y+node.children[node.children.length-1]._y)/2;
    return cur;
  }
  assignY(root,0);
  var flat=[];
  function collect(node,path){
    flat.push({node:node,path:path});
    node.children.forEach(function(ch,i){ collect(ch,path.concat(i)); });
  }
  collect(root,[]);
  var maxD=flat.reduce(function(a,x){ return Math.max(a,x.path.length); },0);
  var maxY=flat.reduce(function(a,x){ return Math.max(a,x.node._y); },0);
  var W=Math.max(160,(maxD+1)*NW+PX*2);
  var H=Math.max(50,(maxY+1)*NH+PY*2);
  function nx(path){ return PX+path.length*NW+NW/2; }
  function ny(node){ return PY+node._y*NH+NH/2; }
  function onPath(path){
    if(path.length>currentPath.length) return false;
    for(var i=0;i<path.length;i++) if(path[i]!==currentPath[i]) return false;
    return true;
  }
  function isCur(path){ return path.length===currentPath.length&&onPath(path); }
  return (
    <svg width={W} height={H} style={{display:"block",minWidth:"100%"}}>
      <rect width="100%" height={H} fill="#F5EFE0" rx="6"/>
      {flat.map(function(item){
        return item.node.children.map(function(ch,i){
          var cp=item.path.concat(i);
          var act=onPath(cp);
          return <line
            key={"e"+item.path.join("-")+i}
            x1={nx(item.path)} y1={ny(item.node)}
            x2={nx(cp)} y2={ny(ch)}
            stroke={act?"#333":"#b8a880"}
            strokeWidth={act?2:1.2}
            opacity={act?1:0.55}/>;
        });
      })}
      {flat.map(function(item){
        var cur=isCur(item.path);
        var act=onPath(item.path);
        var color=item.node.move&&!item.node.move.pass?item.node.move.color:null;
        var fill=color==="B"?"#1a1a1a":color==="W"?"#f5f5f0":"#c8a96e";
        var stroke=cur?"#4A8870":act?"#5A4A30":"#C4BAA8";
        var strokeW=cur?3:1.5;
        var r=Math.round((cur?14:10)*zoom);
        var hasSetup=item.path.length===0&&Object.keys(item.node.setupStones||{}).length>0;
        var lbl=item.node.move?
          (item.node.move.pass?(item.node.move.color+"ps"):coord(item.node.move.r,item.node.move.c,boardSize)):
          (item.path.length===0?(hasSetup?"setup":"root"):"?");
        if(hasSetup&&!item.node.move) fill="#C8A55A";
        var tf=color==="B"?"#fff":color==="W"?"#333":"#fff";
        var key="n"+item.path.join("-")+item.node.id;
        return (
          <g key={key} id={cur?"tree-active-node":undefined} style={{cursor:"pointer"}} onClick={function(){ onNavigate(item.path); }}>
            <circle cx={nx(item.path)} cy={ny(item.node)} r={r+6} fill="transparent"/>
            {cur&&<circle cx={nx(item.path)} cy={ny(item.node)} r={r+5} fill="none" stroke="#4A8870" strokeWidth={1.5} opacity={0.35}/>}
            {item.node.flagged&&<circle cx={nx(item.path)} cy={ny(item.node)} r={r+4} fill="#3A1212" stroke="#8B2020" strokeWidth="3"/>}
            <circle cx={nx(item.path)} cy={ny(item.node)} r={r} fill={fill} stroke={stroke} strokeWidth={strokeW}/>
            <text x={nx(item.path)} y={ny(item.node)+3.5*zoom} textAnchor="middle" fontSize={Math.round(8*zoom)}
              fill={tf} fontFamily="monospace" pointerEvents="none">{lbl}</text>
          </g>
        );
      })}
    </svg>
  );
}

// Go Board
function GoBoard(props){
  var stones=props.stones||{};
  var onPlace=props.onPlace;
  var lastMove=props.lastMove;
  var size=props.size||19;
  var showCoords=props.showCoords||false;
  var readOnly=props.readOnly||false;
  var hintStones=props.hintStones||[];
  var wrongStone=props.wrongStone||null;
  var pendingStone=props.pendingStone||null;
  var flipped=props.flipped||false;
  var branchPoints=props.branchPoints||[];
  var annotations=props.annotations||[];
  var showNumbers=props.showNumbers||false;
  var nextColor=props.nextColor||"B";
  var noHover=props.noHover||false;

  var[hover,setHover]=useState(null);
  var W=PAD*2+CELL*(size-1);
  var starPts=size===19?STAR19:size===9?STAR9:STAR13;
  function tr(r){ return flipped?size-1-r:r; }
  function tc(c){ return flipped?size-1-c:c; }
  function cx(c){ return PAD+tc(c)*CELL; }
  function cy(r){ return PAD+tr(r)*CELL; }

  var gridLines=[];
  for(var gi=0;gi<size;gi++){
    gridLines.push(
      <line key={"hr"+gi} x1={cx(0)} y1={PAD+gi*CELL} x2={cx(size-1)} y2={PAD+gi*CELL} stroke="#7A5C2A" strokeWidth="0.8"/>
    );
    gridLines.push(
      <line key={"vr"+gi} x1={PAD+gi*CELL} y1={cy(0)} x2={PAD+gi*CELL} y2={cy(size-1)} stroke="#7A5C2A" strokeWidth="0.8"/>
    );
  }

  var stoneEls=Object.keys(stones).map(function(key){
    var parts=key.split(",");
    var r=Number(parts[0]), c=Number(parts[1]);
    var color=stones[key].color;
    var moveNum=stones[key].moveNum;
    var isLast=lastMove&&!lastMove.pass&&lastMove.r===r&&lastMove.c===c;
    var tf=color==="B"?"#fff":"#1a1a1a";
    return (
      <g key={key}>
        <circle cx={cx(c)} cy={cy(r)} r={CELL*0.455}
          fill={color==="B"?"#1a1a1a":"#f5f5f0"}
          stroke={color==="B"?"#000":"#bbb"} strokeWidth="0.8"/>
        {(showNumbers&&moveNum!==null)?(
          <text x={cx(c)} y={cy(r)+4.5} textAnchor="middle"
            fontSize={moveNum>=100?9:moveNum>=10?11:13}
            fontWeight="600" fill={tf} fontFamily="monospace"
            pointerEvents="none">{moveNum}</text>
        ):null}
        {(isLast&&!showNumbers)?(
          <circle cx={cx(c)} cy={cy(r)} r={CELL*0.17} fill={color==="B"?"white":"#555"} opacity="0.75"/>
        ):null}
      </g>
    );
  });

  var annEls=annotations.map(function(a,i){
    var stone=stones[sk(a.r,a.c)];
    var sc=stone?stone.color:null;
    if(a.type==="letter"){
      var fg=sc==="B"?"#fff":sc==="W"?"#1a1a1a":"#5a3e1b";
      return (
        <g key={"ann"+i}>
          {!stone?<circle cx={cx(a.c)} cy={cy(a.r)} r={CELL*0.32} fill="#e8d890" stroke="#7A5C2A" strokeWidth="0.8"/>:null}
          <text x={cx(a.c)} y={cy(a.r)+4.5} textAnchor="middle" fontSize="12"
            fontWeight="bold" fill={fg} fontFamily="sans-serif" pointerEvents="none">{a.label}</text>
        </g>
      );
    }
    if(a.type==="triangle"){
      var fg2=sc==="B"?"#fff":sc==="W"?"#1a1a1a":"#5a3e1b";
      var s=CELL*0.3;
      var pts=cx(a.c)+","+( cy(a.r)-s)+" "+(cx(a.c)-s*0.9)+","+(cy(a.r)+s*0.55)+" "+(cx(a.c)+s*0.9)+","+(cy(a.r)+s*0.55);
      return <polygon key={"ann"+i} points={pts} fill="none" stroke={fg2} strokeWidth="1.8"/>;
    }
    return null;
  });

  var hintEls=hintStones.filter(function(h){ return !stones[sk(h.r,h.c)]; }).map(function(h){
    return (
      <circle key={"h"+h.r+h.c} cx={cx(h.c)} cy={cy(h.r)} r={CELL*0.43}
        fill={h.color==="B"?"rgba(26,36,32,0.32)":"rgba(232,238,232,0.55)"}
        stroke={h.color==="B"?"rgba(26,36,32,0.65)":"rgba(168,192,180,0.85)"} strokeWidth="1.5" strokeDasharray="4 2"/>
    );
  });

  var coordEls=[];
  if(showCoords){
    for(var ci=0;ci<size;ci++){
      coordEls.push(
        <text key={"ct"+ci} x={PAD+ci*CELL} y={PAD-10} textAnchor="middle" fontSize="8.5" fill="#5a3e1b" fontFamily="monospace">
          {flipped?COLS[size-1-ci]:COLS[ci]}
        </text>
      );
      coordEls.push(
        <text key={"cl"+ci} x={PAD-12} y={PAD+ci*CELL+3.5} textAnchor="end" fontSize="8.5" fill="#5a3e1b" fontFamily="monospace">
          {flipped?ci+1:size-ci}
        </text>
      );
    }
  }

  var clickZones=[];
  if(!readOnly){
    for(var cr=0;cr<size;cr++){
      for(var cc=0;cc<size;cc++){
        (function(row,col){
          clickZones.push(
            <rect key={sk(row,col)} x={cx(col)-CELL/2} y={cy(row)-CELL/2} width={CELL} height={CELL}
              fill="transparent"
              onMouseEnter={function(){ setHover({r:row,c:col}); }}
              onClick={function(){ if(onPlace) onPlace(row,col); }}/>
          );
        })(cr,cc);
      }
    }
  }

  var hoverEl=null;
  if(!readOnly&&!noHover&&hover&&!stones[sk(hover.r,hover.c)]){
    hoverEl=<circle cx={cx(hover.c)} cy={cy(hover.r)} r={CELL*0.43}
      fill={nextColor==="B"?"rgba(0,0,0,0.22)":"rgba(255,255,255,0.42)"}
      stroke={nextColor==="B"?"rgba(0,0,0,0.45)":"rgba(180,180,180,0.7)"} strokeWidth="0.8"/>;
  }

  var wrongEl=null;
  if(wrongStone){
    wrongEl=<circle cx={cx(wrongStone.c)} cy={cy(wrongStone.r)} r={CELL*0.43}
      fill="rgba(180,60,40,0.5)" stroke="var(--color-text-danger)" strokeWidth="1.5"/>;
  }
  var pendingEl=null;
  if(pendingStone&&!pendingStone.pass&&!stones[sk(pendingStone.r,pendingStone.c)]){
    pendingEl=<circle cx={cx(pendingStone.c)} cy={cy(pendingStone.r)} r={CELL*0.43}
      fill={pendingStone.color==="B"?"rgba(46,61,56,0.4)":"rgba(232,238,232,0.55)"}
      stroke={pendingStone.color==="B"?"rgba(46,61,56,0.7)":"rgba(168,192,180,0.9)"}
      strokeWidth="1.5" strokeDasharray="3 2"/>;
  }

  var branchEls=branchPoints.map(function(bp){
    return <circle key={"bp"+bp.r+bp.c} cx={cx(bp.c)} cy={cy(bp.r)} r={CELL*0.43}
      fill="transparent" stroke={bp.color==="B"?"#111":"#eee"} strokeWidth="2" strokeDasharray="4 3" opacity="0.7"/>;
  });

  return (
    <svg width={W} height={W} style={{display:"block",cursor:"default"}}
      onMouseLeave={function(){ setHover(null); }}>
      <rect width={W} height={W} rx="4" fill="#C8A96E"/>
      {gridLines}
      {starPts.map(function(sp){ return <circle key={sk(sp[0],sp[1])} cx={cx(sp[1])} cy={cy(sp[0])} r={2.5} fill="#7A5C2A"/>; })}
      {branchEls}
      {hoverEl}
      {hintEls}
      {wrongEl}
      {pendingEl}
      {stoneEls}
      {annEls}
      {coordEls}
      {clickZones}
    </svg>
  );
}

// -- Audio: stone sounds via Web Audio API ------------------------------------
// Decode each sound once into an AudioBuffer. On each play, create a new
// BufferSourceNode — these are zero-latency, polyphonic, and never clip each
// other regardless of timing. HTMLAudio cloneNode() re-decodes on every play
// causing startup latency; Web Audio buffers avoid this entirely.

var _audioCtx=null;
function _getCtx(){
  if(!_audioCtx) _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==="suspended") _audioCtx.resume();
  return _audioCtx;
}

// Decode a base64 data URI into an AudioBuffer promise
function _decodeSound(dataUri){
  return new Promise(function(resolve){
    try{
      var b64=dataUri.split(",")[1];
      var bin=atob(b64);
      var buf=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
      _getCtx().decodeAudioData(buf.buffer,
        function(decoded){ resolve(decoded); },
        function(){ resolve(null); }
      );
    }catch(e){ resolve(null); }
  });
}

// Decode all sounds up front; store as AudioBuffer or null
var _stoneBufs=_stoneSounds.map(function(){ return null; });
var _captureBufs=_captureSounds.map(function(){ return null; });
Promise.all(_stoneSounds.map(function(s,i){
  return _decodeSound(s).then(function(b){ _stoneBufs[i]=b; });
}));
Promise.all(_captureSounds.map(function(s,i){
  return _decodeSound(s).then(function(b){ _captureBufs[i]=b; });
}));

function _playBuf(bufs, lastIdxRef){
  try{
    var n=bufs.length; if(!n) return;
    var idx=lastIdxRef[0];
    if(n>1){ do{ idx=Math.floor(Math.random()*n); }while(idx===lastIdxRef[0]); }
    else idx=0;
    lastIdxRef[0]=idx;
    var buf=bufs[idx];
    if(!buf) return;
    var ctx=_getCtx();
    var src=ctx.createBufferSource();
    src.buffer=buf;
    var gain=ctx.createGain();
    gain.gain.value=0.85;
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(0);
  }catch(e){}
}

var _sIdx=[-1], _cIdx=[-1];
function playTok(){ _playBuf(_stoneBufs,_sIdx); }
function playCapture(){ _playBuf(_captureBufs,_cIdx); }

const TABS={library:"library",quiz:"quiz",editor:"editor",about:"about"};



// Find a position in josekiRoot where the current board state matches
// and the attempted move (moveR,moveC,playerColor) is a valid child.
// currentStones: object keyed by "r,c" with {color} values (qStones format).
// Returns {path, childIdx} or null.
function findPositionInJoseki(josekiRoot, currentStones){
  // Find path in josekiRoot where board state exactly matches currentStones
  function stonesForPath(root,path){
    var st={};
    Object.keys(root.setupStones||{}).forEach(function(k){ st[k]=root.setupStones[k]; });
    var n=root;
    if(n.move&&!n.move.pass) st[sk(n.move.r,n.move.c)]=n.move.color;
    for(var i=0;i<path.length;i++){ n=n.children[path[i]]; if(!n) break; if(n.move&&!n.move.pass) st[sk(n.move.r,n.move.c)]=n.move.color; }
    return st;
  }
  function boardsMatch(josekiSt,currentSt){
    var jk=Object.keys(josekiSt),ck=Object.keys(currentSt);
    if(jk.length!==ck.length) return false;
    for(var i=0;i<jk.length;i++){
      var k=jk[i]; var cs=currentSt[k]; if(!cs) return false;
      var cc=cs.color!==undefined?cs.color:cs; if(josekiSt[k]!==cc) return false;
    }
    return true;
  }
  var result=null;
  function walk(node,path){
    if(result) return;
    var jsst=stonesForPath(josekiRoot,path);
    if(boardsMatch(jsst,currentStones)){ result=path; return; }
    if(Object.keys(jsst).length<Object.keys(currentStones).length)
      node.children.forEach(function(ch,i){ walk(ch,path.concat(i)); });
  }
  walk(josekiRoot,[]);
  return result;
}

function findMatchInJoseki(josekiRoot, currentStones, moveR, moveC, playerColor){
  // Build the full stone map for a path (setup + sequence moves)
  function stonesForPath(root, path){
    var st={};
    // Setup stones at root
    Object.keys(root.setupStones||{}).forEach(function(k){ st[k]=root.setupStones[k]; });
    var n=root;
    if(n.move&&!n.move.pass) st[sk(n.move.r,n.move.c)]=n.move.color;
    for(var i=0;i<path.length;i++){
      n=n.children[path[i]]; if(!n) break;
      if(n.move&&!n.move.pass) st[sk(n.move.r,n.move.c)]=n.move.color;
    }
    return st;
  }
  // Check if joseki stone map matches the current board exactly (same keys, same colors)
  function boardsMatch(josekiSt, currentSt){
    var jk=Object.keys(josekiSt), ck=Object.keys(currentSt);
    if(jk.length!==ck.length) return false;
    for(var i=0;i<jk.length;i++){
      var k=jk[i];
      var cs=currentSt[k];
      if(!cs) return false;
      // currentStones values are {color,moveNum} objects
      var cc=cs.color!==undefined?cs.color:cs;
      if(josekiSt[k]!==cc) return false;
    }
    return true;
  }
  var result=null;
  function walk(node, path){
    if(result) return;
    var josekiSt=stonesForPath(josekiRoot,path);
    var jCount=Object.keys(josekiSt).length;
    var cCount=Object.keys(currentStones).length;
    // Prune: if joseki already has more stones than board, no match possible
    if(jCount>cCount) return;
    if(boardsMatch(josekiSt, currentStones)){
      // Check if attempted move is a valid child
      for(var i=0;i<node.children.length;i++){
        var ch=node.children[i];
        if(ch.move&&!ch.move.pass&&ch.move.r===moveR&&ch.move.c===moveC&&ch.move.color===playerColor){
          result={path:path,childIdx:i};
          return;
        }
      }
      // Even if no child matches, don't walk deeper (board state matched exactly)
      return;
    }
    // Only recurse if we haven't exceeded the board stone count
    if(jCount<cCount){
      for(var j=0;j<node.children.length;j++){
        walk(node.children[j], path.concat(j));
      }
    }
  }
  walk(josekiRoot,[]);
  return result;
}

function App(){
  const[entries,setEntries]=useState([]);
  const[folders,setFolders]=useState([]);
  const[loaded,setLoaded]=useState(false);
  const[fetching,setFetching]=useState(false);
  const[tab,setTab]=useState(TABS.library);

  useEffect(function(){
    var saved=loadLib();
    var ROOT_FOLDERS=[
      {id:"f-default",name:"Default Library",collapsed:true,parentId:null},
      {id:"f-custom",name:"Custom Library",collapsed:false,parentId:null}
    ];
    function ensureRoots(flds){
      var ids=flds.map(function(f){ return f.id; });
      var out=flds.slice();
      ROOT_FOLDERS.forEach(function(rf){
        if(ids.indexOf(rf.id)===-1) out.unshift(rf);
      });
      return out;
    }
    function applyDefaultLib(data){
      // Re-root any top-level imported folders under f-default
      var impFolders=(data.folders||[]).filter(function(f){
        return f.id!=="f-default"&&f.id!=="f-custom";
      });
      var impFolderIds=impFolders.map(function(f){ return f.id; });
      impFolders=impFolders.map(function(f){
        var parentInSet=f.parentId&&impFolderIds.indexOf(f.parentId)!==-1;
        return parentInSet?f:{...f,parentId:"f-default"};
      });
      var impEntries=(data.entries||[]).map(function(e){
        return impFolderIds.indexOf(e.folderId)!==-1?e:{...e,folderId:"f-default"};
      });
      setFolders(ensureRoots(impFolders));
      setEntries(impEntries);
      setLoaded(true);
    }
    if(saved&&saved.entries){
      // Existing data - just ensure root folders are present
      setEntries(saved.entries);
      setFolders(ensureRoots(saved.folders||[]));
      setLoaded(true);
    } else {
      // First run - try to fetch JS-Default-Library.json from same origin
      var libUrl=window.location.href.replace(/\/[^/]*$/, "")+"/JS-Default-Library.json";
      // If served from file:// or localhost during dev, skip the fetch
      if(window.location.protocol==="file:"){
        var d=buildDemo(); setEntries(d.entries); setFolders(d.folders); setLoaded(true);
      } else {
        setFetching(true);
        fetch(libUrl)
          .then(function(r){ return r.ok?r.json():Promise.reject(r.status); })
          .then(function(data){ applyDefaultLib(data); setFetching(false); })
          .catch(function(){
            // Library not found - start with empty library
            var d=buildDemo(); setEntries(d.entries); setFolders(d.folders); setLoaded(true);
            setFetching(false);
          });
      }
    }
  },[]);

  const firstSave=useRef(false);
  useEffect(function(){
    if(!loaded) return;
    if(!firstSave.current){ firstSave.current=true; return; }
    saveLib({entries:entries,folders:folders});
  },[entries,folders,loaded]);

  // Import/export
  const importRef=useRef(null);
  const[importErr,setImportErr]=useState("");
  const[showExportMenu,setShowExportMenu]=useState(false);
  const[showImportMenu,setShowImportMenu]=useState(false);
  const[confirmDialog,setConfirmDialog]=useState(null);
  const importDefaultRef=useRef(null);

  function handleImportFile(e, which){
    var f=e.target.files[0]; if(!f) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var imported=parseImport(ev.target.result);
        var rootId=which==="default"?"f-default":"f-custom";

        // Collect all folder ids under a given parent (recursively) from a folder list
        function getFolderIds(parentId, allFolders){
          var ids=[parentId];
          allFolders.filter(function(f){ return f.parentId===parentId; })
            .forEach(function(f){ getFolderIds(f.id,allFolders).forEach(function(id){ ids.push(id); }); });
          return ids;
        }

        // Process imported folders:
        // - Strip out any f-default/f-custom from imported data
        // - Any folder with no parent (or whose parent isn't in the imported set)
        //   gets re-rooted under rootId
        var impFolders=(imported.folders||[]).filter(function(f){
          return f.id!=="f-default"&&f.id!=="f-custom";
        });
        var impFolderIds=impFolders.map(function(f){ return f.id; });
        impFolders=impFolders.map(function(f){
          // Re-root folders whose parent is missing from the imported set (or is null)
          var parentInSet=f.parentId&&impFolderIds.indexOf(f.parentId)!==-1;
          return parentInSet?f:{...f,parentId:rootId};
        });

        // Process imported entries: collect all folder ids in the imported set
        // plus rootId itself, so entries whose folderId is in that set are included
        var impFolderIdSet=impFolderIds.concat([rootId]);
        var impEntries=(imported.entries||[]).map(function(e){
          // If entry's folderId isn't in the imported folder set, assign to rootId
          return impFolderIdSet.indexOf(e.folderId)!==-1?e:{...e,folderId:rootId};
        });

        setFolders(function(prev){
          // Remove existing folders under the target root
          var existingTargetIds=getFolderIds(rootId,prev);
          var keep=prev.filter(function(f){
            return f.id==="f-default"||f.id==="f-custom"||existingTargetIds.indexOf(f.id)===-1;
          });
          var byId={};
          keep.forEach(function(f){ byId[f.id]=f; });
          impFolders.forEach(function(f){ byId[f.id]=f; });
          return Object.values(byId);
        });

        setEntries(function(prev){
          // All folder ids that belong to the target root after import:
          // = existing folders under root + all newly imported folder ids + rootId itself
          var allOverwrittenIds=impFolderIds.concat([rootId]);
          var kept=prev.filter(function(e){ return allOverwrittenIds.indexOf(e.folderId)===-1; });
          return kept.concat(impEntries);
        });

        setImportErr(""); setShowImportMenu(false);
      }catch(err){ setImportErr("Import failed: "+err.message); }
    };
    reader.readAsText(f); e.target.value="";
  }

  function ScaledBoard(props){
    var size=props.size;
    var viewMode=props.viewMode||"full";
    var viewRot=props.viewRot||0; // 0=BR 1=BL 2=TL 3=TR
    var raw=PAD*2+CELL*(size-1);
    var maxW=Math.max(60,boardAvail-2);
    var rest={};
    Object.keys(props).forEach(function(k){ if(k!=="size"&&k!=="viewMode"&&k!=="viewRot") rest[k]=props[k]; });

    if(viewMode==="full"){
      var s=maxW/raw;
      return (
        <div style={{width:raw*s,height:raw*s,flexShrink:0,overflow:"hidden"}}>
          <div style={{transform:"scale("+s+")",transformOrigin:"top left",width:raw,height:raw}}>
            <GoBoard size={size} {...rest}/>
          </div>
        </div>
      );
    }

    // half: all rows, half the cols (left/right strip) OR all cols, half the rows (top/bottom strip)
    // quarter: half cols, half rows (corner)
    var halfLines=Math.ceil(size/2);

    // For half view, rotation 0/2 = top/bottom (all cols, half rows)
    //                rotation 1/3 = left/right (half cols, all rows)
    var rowLines, colLines;
    if(viewMode==="quarter"){
      rowLines=halfLines; colLines=halfLines;
    } else if(viewRot===1||viewRot===3){
      // Left/right half: full rows, half cols
      rowLines=size; colLines=halfLines;
    } else {
      // Top/bottom half: half rows, full cols
      rowLines=halfLines; colLines=size;
    }

    // rot 0=BR, 1=BL, 2=TL, 3=TR
    // colStart: for right-side rotations (0,2 quarter; 3 half-right), start from right half
    var colStart=(viewRot===0||viewRot===3)?(size-colLines):0;
    var rowStart=(viewRot===0||viewRot===1)?(size-rowLines):0;
    var offX=colStart*CELL;
    var offY=rowStart*CELL;

    // Visible pixel region (full PAD on all sides of the visible grid lines)
    var visW=PAD*2+CELL*(colLines-1);
    var visH=PAD*2+CELL*(rowLines-1);

    // Scale to fit both width and height, preserving aspect ratio
    // Use boardAvail as both the max width and max height budget
    var maxH=Math.max(60,boardAvail-2);
    var s=Math.min(maxW/visW, maxH/visH);

    // gx/gy: exact pixel position of board grid line c or r in overlay space
    // offX = colStart*CELL (no PAD offset since visW already includes PAD on both sides)
    // SVG pixel of col c in GoBoard: PAD + c*CELL
    // After translate(-offX): PAD + (c - colStart)*CELL
    // After scale(s): (PAD + (c-colStart)*CELL) * s
    function gxS(c){ return (PAD + (c-colStart)*CELL)*s; }
    function gyS(r){ return (PAD + (r-rowStart)*CELL)*s; }

    // Board-anchored labels: A=col0 always left, 19=row0 always top
    var showCoordsOverlay=rest.showCoords;
    var overlayLabels=[];
    if(showCoordsOverlay){
      var flipped=rest.flipped||false;
      var cellPx=CELL*s;
      var halfPad=cellPx*0.5;
      var fsS=Math.max(9,Math.min(13,Math.round(halfPad*0.7)));

      // Column labels: on bottom edge if bottom (row 18) is visible, else top (row 0)
      var colEdgeRow=(rowStart+rowLines-1===size-1)?(size-1):(rowStart===0?0:-1);
      if(colEdgeRow>=0){
        var colAtBottom=(colEdgeRow===size-1);
        var colY=colAtBottom ? gyS(colEdgeRow)+halfPad*0.55 : gyS(colEdgeRow)-halfPad*0.35;
        for(var ci2=colStart;ci2<colStart+colLines;ci2++){
          var colLabel=flipped?COLS[size-1-ci2]:COLS[ci2];
          overlayLabels.push(
            <text key={"oc"+ci2} x={gxS(ci2)} y={colY}
              textAnchor="middle" fontSize={fsS} fill="#5a3e1b" fontFamily="monospace">{colLabel}</text>
          );
        }
      }

      // Row labels: on left edge if col 0 is visible, else right (col 18)
      var rowEdgeCol=(colStart===0)?0:(colStart+colLines-1===size-1?(size-1):-1);
      if(rowEdgeCol>=0){
        var rowAtLeft=(rowEdgeCol===0);
        var rowX=rowAtLeft ? gxS(rowEdgeCol)-halfPad*0.5 : gxS(rowEdgeCol)+halfPad*0.5;
        for(var ri2=rowStart;ri2<rowStart+rowLines;ri2++){
          var rowLabel=flipped?(ri2+1):(size-ri2);
          overlayLabels.push(
            <text key={"or"+ri2} x={rowX} y={gyS(ri2)+fsS*0.38}
              textAnchor="middle" fontSize={fsS} fill="#5a3e1b" fontFamily="monospace">{rowLabel}</text>
          );
        }
      }
    }

    // Pass showCoords=false to GoBoard since we overlay our own labels
    var boardRest={};
    Object.keys(rest).forEach(function(k){ boardRest[k]=rest[k]; });
    boardRest.showCoords=false;

    return (
      <div style={{position:"relative",width:visW*s,height:visH*s,flexShrink:0}}>
        <div style={{overflow:"hidden",width:visW*s,height:visH*s}}>
          <div style={{
            transform:"scale("+s+") translate("+(-offX)+"px,"+(-offY)+"px)",
            transformOrigin:"0 0",

          <svg style={{position:"absolute",top:0,left:0,pointerEvents:"none"}}

  }


  // CroppedBoard: shows only the region of the board relevant to the joseki,
  // computed from the bounding box of all moves in the tree.
  // bbox: {minR,maxR,minC,maxC} - will be padded and clamped.
  // flipped: if true, mirror the offset (corner switches)
  function CroppedBoard(props){
    var size=props.size;
    var bbox=props.bbox; // {minR,maxR,minC,maxC}
    var raw=PAD*2+CELL*(size-1);

    // Default to full board if no bbox
    if(!bbox){
      var maxW2=Math.max(60,boardAvail-2);
      var s2=maxW2/raw;
      var rest2={};
      Object.keys(props).forEach(function(k){ if(k!=="bbox") rest2[k]=props[k]; });
      return (
        <div style={{width:raw*s2,height:raw*s2,overflow:"hidden",flexShrink:0}}>
          <div style={{transform:"scale("+s2+")",transformOrigin:"top left",width:raw,height:raw}}>
            <GoBoard size={size} {...rest2}/>
          </div>
        </div>
      );
    }

    // Add 2 lines of padding on each side, clamped to board edges
    var PAD_LINES=2;
    var r0=Math.max(0, bbox.minR-PAD_LINES);
    var r1=Math.min(size-1, bbox.maxR+PAD_LINES);
    var c0=Math.max(0, bbox.minC-PAD_LINES);
    var c1=Math.min(size-1, bbox.maxC+PAD_LINES);

    // If more than two-thirds of the board is needed in BOTH dimensions, show the full board
    var rowsNeeded = r1 - r0 + 1;
    var colsNeeded = c1 - c0 + 1;
    if(rowsNeeded > size*2/3 && colsNeeded > size*2/3){
      r0=0; r1=size-1; c0=0; c1=size-1;
    } else {
      // Anchor to the nearest corner so at least one board corner is always visible.
      // Find which corner the bbox centre is closest to.
      var midR=(r0+r1)/2, midC=(c0+c1)/2;
      var nearTop=midR < size/2, nearLeft=midC < size/2;
      // Snap the appropriate edge to the board border
      if(nearTop){
        // Anchor top edge: r0 must be 0
        r0=0;
        r1=Math.min(size-1, r0+rowsNeeded-1);
      } else {
        // Anchor bottom edge: r1 must be size-1
        r1=size-1;
        r0=Math.max(0, r1-rowsNeeded+1);
      }
      if(nearLeft){
        // Anchor left edge: c0 must be 0
        c0=0;
        c1=Math.min(size-1, c0+colsNeeded-1);
      } else {
        // Anchor right edge: c1 must be size-1
        c1=size-1;
        c0=Math.max(0, c1-colsNeeded+1);
      }
    }

    // Board is NEVER flipped in practice mode.
    // r=0 is always top (row 19), r=18 is always bottom (row 1).
    // c=0 is always left (col A), c=18 is always right (col T).
    // The GoBoard SVG pixel positions (no flip):
    //   cx(c) = PAD + c*CELL
    //   cy(r) = PAD + r*CELL
    // Clip the SVG to show board cols c0..c1, rows r0..r1:
    var offX = PAD + c0*CELL - CELL*0.5;
    var offY = PAD + r0*CELL - CELL*0.5;
    var visW = (c1-c0+1)*CELL;
    var visH = (r1-r0+1)*CELL;

    // Scaling: cap cell size at MAX_CELL_PX so small joseki crops don't upscale hugely
    var MAX_CELL_PX=60;
    var maxW=Math.max(60,boardAvail-2);
    var s=Math.min(maxW/visW, MAX_CELL_PX/CELL);
    var bW=visW*s;
    var bH=visH*s;

    // gx(c) and gy(r): exact overlay pixel position of board grid line c or r.
    // offX = PAD + c0*CELL - CELL*0.5, so:
    //   gx(c) = (PAD + c*CELL - offX)*s = (c-c0)*CELL*s + CELL*0.5*s
    function gx(c){ return (c-c0)*CELL*s + CELL*0.5*s; }
    function gy(r){ return (r-r0)*CELL*s + CELL*0.5*s; }

    var rest={};
    Object.keys(props).forEach(function(k){ if(k!=="bbox") rest[k]=props[k]; });
    var boardRest2={};
    Object.keys(rest).forEach(function(k){ boardRest2[k]=rest[k]; });
    boardRest2.showCoords=false;
    boardRest2.flipped=false;

    // Build coordinate labels.
    // Labels sit INSIDE the clip window, just inside the outermost grid line
    // so they are never clipped by overflow:hidden.
    // Column letters: bottom edge (r1=18) preferred, top (r0=0) fallback.
    // Row numbers:    left edge  (c0=0)  preferred, right (c1=18) fallback.
    var showCoordsOverlay=rest.showCoords;
    var overlayC=[];
    if(showCoordsOverlay){
      var cellPx=CELL*s;
      var halfPad=cellPx*0.5; // the PAD region is half a cell wide on each side
      var fs=Math.max(11,Math.min(15,Math.round(halfPad*0.7)));

      // Column letters: centred in the PAD gap between edge grid line and board border
      // Bottom edge: gap is below gy(r1) -> label at gy(r1) + halfPad*0.5
      // Top edge:    gap is above gy(r0) -> label at gy(r0) - halfPad*0.5
      var colEdgeRow=(r1===size-1)?r1:(r0===0?r0:-1);
      if(colEdgeRow>=0){
        var colAtBottom=(colEdgeRow===size-1);
        var colY=colAtBottom
          ? gy(colEdgeRow)+halfPad*0.55
          : gy(colEdgeRow)-halfPad*0.35;
        for(var bc=c0;bc<=c1;bc++){
          overlayC.push(
            <text key={"cl"+bc} x={gx(bc)} y={colY}
              textAnchor="middle" fontSize={fs} fill="#5a3e1b" fontFamily="monospace">
              {COLS[bc]}
            </text>
          );
        }
      }

      // Row numbers: centred in the PAD gap between edge grid line and board border
      // Left edge:  gap is left of gx(c0) -> label at gx(c0) - halfPad*0.5
      // Right edge: gap is right of gx(c1) -> label at gx(c1) + halfPad*0.5
      var rowEdgeCol=(c0===0)?c0:(c1===size-1?c1:-1);
      if(rowEdgeCol>=0){
        var rowAtLeft=(rowEdgeCol===0);
        var rowX=rowAtLeft
          ? gx(rowEdgeCol)-halfPad*0.5
          : gx(rowEdgeCol)+halfPad*0.5;
        for(var br=r0;br<=r1;br++){
          overlayC.push(
            <text key={"rl"+br} x={rowX} y={gy(br)+fs*0.38}
              textAnchor="middle" fontSize={fs} fill="#5a3e1b" fontFamily="monospace">
              {size-br}
            </text>
          );
        }
      }
    }

    return (
      <div style={{position:"relative",width:bW,height:bH,flexShrink:0}}>
        <div style={{position:"absolute",top:0,left:0,width:bW,height:bH,overflow:"hidden"}}>
          <div style={{
            transform:"scale("+s+") translate("+(-offX)+"px,"+(-offY)+"px)",
            transformOrigin:"0 0",width:raw,height:raw
          }}>
            <GoBoard size={size} {...boardRest2}/>
          </div>
        </div>
        {overlayC.length>0&&(
          <svg style={{position:"absolute",top:0,left:0,pointerEvents:"none"}}
            width={bW} height={bH}>
            {overlayC}
          </svg>
        )}
      </div>
    );
  }

  var _editBoardH=(function(){

  function startQuiz(entry,sOverride){

  function buildWrongContinuations(kids){

            .forEach(function(ch){ var k=sk(ch.move.r,ch.move.c); if(!seen[k]){ seen[k]=true; moves.push({r:ch.move.r,c:ch.move.c,color:ch.move.color}); } });

  function handleQuizBoardClick(r,c){
    // Always read the current path from the ref -- never from stale qPath closure
    var activePath=qPathRef.current.slice();
    // Clear correct-tenuki message on any board interaction
    if(qCorrectTenuki) setQCorrectTenuki(false);

    // In wrong/review mode: if tap is on a valid continuation, place it immediately.
    // If tap is elsewhere, enter review mode (continuations stay, buttons appear).
    if(qStatus==="wrong"||qStatus==="review"){
      if(r>=0&&c>=0){
        // Check if tap is on one of the shown continuations
        var revConts=qWrongContinuations;
        var revOnCont=revConts.findIndex(function(m){ return m.r===r&&m.c===c; });
        if(revOnCont!==-1){

              var revCRoot=deepClone(revCand.root);
              if(qTransform.mH||qTransform.mV) revCRoot=mirrorTree(revCRoot,revCand.boardSize,qTransform.mH,qTransform.mV);
              if(qTransform.inverted){ revCRoot=invertTree(revCRoot); }

        setQPath(tenukiPath); setQStatus("waiting");
      } else {
        setQScore(function(s){ return {c:s.c,w:s.w+1}; });
        setQSession(function(ss){ return {points:ss.points, streak:0, totalC:ss.totalC, totalW:ss.totalW+1}; });
        setQStatus("wrong");
        setQWrongContinuations(buildWrongContinuations(kids));
        setQWrongWasTenuki(true);
      }
      return;
    }

    // Find if this intersection matches a valid child move
    var mi=kids.findIndex(function(ch){ return ch.move&&!ch.move.pass&&ch.move.r===r&&ch.move.c===c&&ch.move.color===qPlayerColor; });
    if(mi!==-1){
      // Correct move in current joseki
      var ch=kids[mi];
      var afterPlace=applyMove(activeStones,r,c,ch.move.color,qEntry.boardSize);
      if(afterPlace.captured>0) playCapture(afterPlace.captured); else playTok();
      setQStones(afterPlace.stones);
      setQPendingOpp(null);
      var newActivePath=activePath.concat(mi);
      qPathRef.current=newActivePath;
      setQScore(function(s){ return {c:s.c+1,w:s.w}; });
      setQSession(function(ss){
        var newStreak=ss.streak+1;
        var mult=Math.min(1+newStreak*0.5,3);
        var pts=Math.round(10*mult);
        return {points:ss.points+pts, streak:newStreak, totalC:ss.totalC+1, totalW:ss.totalW};
      });
      setQOppTenuki(false);
      setQHint(false); setQWrongContinuations([]); setQStatus("correct");
      setTimeout(function(){ setQPath(newActivePath); setQStatus("waiting"); },850);
    } else {
      // Not in current joseki -- try dynamic switch to another enabled joseki
      var switched=false;
      for(var ei=0;ei<enabledEntries.length&&!switched;ei++){
        var candidate=enabledEntries[ei];
        if(candidate.id===qEntry.id) continue;
        if(candidate.boardSize!==qEntry.boardSize) continue;
        var cRoot=deepClone(candidate.root);
        if(qTransform.mH||qTransform.mV) cRoot=mirrorTree(cRoot,candidate.boardSize,qTransform.mH,qTransform.mV);
        if(qTransform.inverted){ cRoot=invertTree(cRoot); }
        var match=findMatchInJoseki(cRoot,activeStones,r,c,qPlayerColor);
        if(match){
          var newPath=match.path.concat(match.childIdx);
          var newStoneState=stateAlongPath(cRoot,newPath);
          var newStones={};
          Object.keys(newStoneState.stones).forEach(function(k){
            newStones[k]={color:newStoneState.stones[k].color,moveNum:null};
          });
          qPathRef.current=newPath;
          playTok();
          setQEntry(candidate); setQRoot(cRoot); setQPath(newPath); setQStones(newStones);
          setQPendingOpp(null);
          setQScore(function(s){ return {c:s.c+1,w:s.w}; });
      setQSession(function(ss){
        var newStreak=ss.streak+1;
        var mult=Math.min(1+newStreak*0.5,3);
        var pts=Math.round(10*mult);
        return {points:ss.points+pts, streak:newStreak, totalC:ss.totalC+1, totalW:ss.totalW};
      });
      setQHint(false); setQWrongContinuations([]); setQStatus("correct");
          setTimeout(function(){ setQStatus("waiting"); },850);
          switched=true;
        }
      }
      if(!switched){
        // Wrong move
        setQWrong({r:r,c:c});
        setQScore(function(s){ return {c:s.c,w:s.w+1}; });
        setQSession(function(ss){ return {points:ss.points, streak:0, totalC:ss.totalC, totalW:ss.totalW+1}; });
        setQStatus("wrong");
        setQWrongContinuations(buildWrongContinuations(kids));
        // If all correct continuations are pass moves, flag it so the UI
        // can show a message directing the player to use the Tenuki button
        var allPass=kids.length>0&&kids.every(function(ch){ return !ch.move||ch.move.pass; });
        setQWrongIsTenuki(allPass);
        // Player taps board anywhere to dismiss wrong marker and try again
      }
    }
  }

  function renderFolder(folder, depth){

      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    var allOn=fEntries.every(function(e){ return e.enabled!==false; })&&subFolders.every(function(sf){

                    setFolders(function(prev){
                      return prev.map(function(f){ return f.id===folder.id?{...f,parentId:newParent}:f; });
                    });
                    setMovingFolderId(null);
                  }}>
                  {(function(){
                    // Build hierarchy excluding this folder and its descendants
                    function getDesc(id){
                      var ids=new Set([id]);
                      folders.forEach(function(f){ if(ids.has(f.parentId)) ids.add(f.id); });
                      // Repeat to catch deeper descendants
                      var changed=true;
                      while(changed){ changed=false; folders.forEach(function(f){ if(ids.has(f.parentId)&&!ids.has(f.id)){ ids.add(f.id); changed=true; } }); }
                      return ids;
                    }
                    var excluded=getDesc(folder.id);
                    function getDepth(f){
                      var d=0,p=f;
                      while(p.parentId){ var par=folders.find(function(x){ return x.id===p.parentId; }); if(!par) break; d++; p=par; }
                      return d;
                    }
                    function buildH(parentId){
                      return folders
                        .filter(function(f){ return (f.parentId||null)===(parentId||null)&&!excluded.has(f.id); })
                        .sort(function(a,b){ return a.name.localeCompare(b.name); })
                        .reduce(function(acc,f){
                          var depth=getDepth(f);
                          var prefix=""; for(var d=0;d<depth;d++) prefix+="-- ";
                          return acc.concat([<option key={f.id} value={f.id}>{prefix+f.name}</option>],buildH(f.id));
                        },[]);
                    }
                    return buildH(null);
                  })()}

        </div>
        {!folder.collapsed&&(
          <div style={{paddingLeft:"0.75rem"}}>
            {subFolders.map(function(sf){ return renderFolder(sf,depth+1); })}
            {fEntries.length===0&&subFolders.length===0&&<p style={{fontSize:"0.76rem",color:"var(--color-text-tertiary)",padding:"0.3rem 0.5rem",fontStyle:"italic"}}>Empty folder</p>}
            {fEntries.map(function(entry){ return renderEntry(entry); })}
          </div>
        )}
      </div>
    );
  }

                      function addPt(r,c){

                      // Stones on the current path

                        });
                      }
                      // Wrong continuations / hints
                      qWrongContinuations.forEach(function(m){
                        addPt(m.r,m.c);
                      });
                      return b;
                    })()}

                  style={{background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",
                    borderRadius:4,padding:"2px 7px",fontSize:"0.78rem",cursor:"pointer",color:"var(--color-text-secondary)"}}>-</button>
                <span style={{fontSize:"0.68rem",color:"var(--color-text-tertiary)",minWidth:32,textAlign:"center"}}>
                  {Math.round(treeModalZoom*100)+"%"}</span>
                <button onClick={function(){ setTreeModalZoom(function(z){ return Math.min(3,+(z+0.15).toFixed(2)); }); }}
                  style={{background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",
                    borderRadius:4,padding:"2px 7px",fontSize:"0.78rem",cursor:"pointer",color:"var(--color-text-secondary)"}}>+</button>
                <button onClick={function(){ setTreeModalZoom(1); }}
                  style={{background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",
                    borderRadius:4,padding:"2px 6px",fontSize:"0.68rem",cursor:"pointer",color:"var(--color-text-secondary)"}}>Reset</button>
                <button onClick={function(){
                  var el=document.getElementById("tree-modal-scroll");
                  var node=document.getElementById("tree-active-node");
                  if(!el||!node) return;
                  var er=el.getBoundingClientRect(), nr=node.getBoundingClientRect();
                  el.scrollLeft += (nr.left+nr.width/2)-(er.left+er.width/2);
                  el.scrollTop  += (nr.top+nr.height/2)-(er.top+er.height/2);
                }} style={{background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",
                  borderRadius:4,padding:"2px 8px",fontSize:"0.68rem",cursor:"pointer",color:"var(--color-text-secondary)"}}>Center</button>
                {(function(){
                  var mn=editPath.length>0?nodeAtPath(editRoot,editPath):null;
                  var mf=mn&&mn.flagged;
                  return <button onClick={handleFlagNode} disabled={!editPath.length}
                    style={{background:mf?"#3A1212":"var(--color-background-secondary)",
                      border:mf?"1px solid #8B2020":"0.5px solid var(--color-border-secondary)",
                      borderRadius:4,padding:"2px 8px",fontSize:"0.78rem",cursor:"pointer",
                      color:mf?"#F4AEAE":"var(--color-text-secondary)"}}>
                    {mf?"Unflag":"Flag"}
                  </button>;
                })()}
                <button onClick={function(){ setTreeModalOpen(false); }}
                  style={{background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",
                    borderRadius:4,padding:"2px 10px",fontSize:"0.78rem",cursor:"pointer",
                    color:"var(--color-text-secondary)",marginLeft:4}}>Close</button>
              </div>
              {/* Body: tree + preview panel */}
              <div style={{display:"flex",flex:1,overflow:"hidden",flexDirection:isMobile?"column":"row"}}>
                {/* Tree - takes 65% */}
                <div id="tree-modal-scroll" style={{flex:isMobile?"0 0 55%":"0 0 75%",overflow:"auto",cursor:"grab",
                  userSelect:"none",borderRight:"0.5px solid var(--color-border-secondary)"}}
                  onMouseDown={function(e){
                    if(e.button!==0) return;
                    var el=e.currentTarget; el.style.cursor="grabbing";
                    var sx=e.clientX,sy=e.clientY,sl=el.scrollLeft,st=el.scrollTop;
                    function onMove(me){ el.scrollLeft=sl-(me.clientX-sx); el.scrollTop=st-(me.clientY-sy); }
                    function onUp(){ el.style.cursor="grab";
                      window.removeEventListener("mousemove",onMove);
                      window.removeEventListener("mouseup",onUp); }
                    window.addEventListener("mousemove",onMove);
                    window.addEventListener("mouseup",onUp);
                  }}>
                  <div style={{display:"inline-block",padding:"12px"}}>
                    <TreeDiagram root={editRoot} currentPath={editPath} boardSize={editSize}
                      zoom={treeModalZoom}
                      onNavigate={function(path){ navigateTo(path); }}/>
                  </div>
                </div>
                {/* Preview panel - 35% */}
                <div style={{flex:isMobile?"1":"0 0 25%",display:"flex",flexDirection:"column",
                  padding:"14px",gap:"0.65rem",overflow:"auto"}}>
                  <div style={{fontWeight:600,fontSize:"0.82rem",color:"var(--color-text-primary)"}}>
                    {modalLabel}
                  </div>
                  {/* Mini board: scale GoBoard to 200px */}
                  {(function(){
                    var raw=PAD*2+CELL*(editSize-1);
                    var s=200/raw;
                    return (
                      <div style={{width:200,height:200,flexShrink:0,overflow:"hidden",alignSelf:"center"}}>
                        <div style={{transform:"scale("+s+")",transformOrigin:"top left",width:raw,height:raw}}>
                          <GoBoard size={editSize} stones={modalStones}
                            lastMove={modalMove} readOnly={true}
                            annotations={modalNode?modalNode.annotations:[]}
                            showCoords={true}/>
                        </div>
                      </div>
                    );
                  })()}
                  {/* Position comment */}
                  {modalComment&&(
                    <div style={{fontSize:"0.79rem",fontStyle:"italic",
                      color:"var(--color-text-secondary)",lineHeight:1.55}}>
                      {(function(){
                        var raw=modalComment.replace(/See\s*\.\s*/g,"").trim();
                        var parts=[]; var re=/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;
                        var last=0,m;
                        while((m=re.exec(raw))!==null){
                          if(m.index>last) parts.push(raw.slice(last,m.index));
                          parts.push(<a key={m.index} href={m[2]} target="_blank" rel="noopener noreferrer"
                            style={{color:"#4A8870"}}>{m[1]}</a>);
                          last=m.index+m[0].length;
                        }
                        if(last<raw.length) parts.push(raw.slice(last));
                        return parts;
                      })()}
                    </div>
                  )}
                  {!modalComment&&(
                    <p style={{fontSize:"0.75rem",color:"var(--color-text-tertiary)",fontStyle:"italic"}}>
                      No comment for this node
                    </p>
                  )}
                  <div style={{marginTop:"auto",fontSize:"0.72rem",color:"var(--color-text-tertiary)"}}>
                    Click any node in the tree to navigate. Press Escape or Close to exit.
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {deletingFolderId&&(function(){
        var folder=folders.find(function(f){ return f.id===deletingFolderId; });
        if(!folder) return null;
        // Count all entries in folder and all descendant folders
        var descIds=getAllDescendantFolderIds(deletingFolderId,folders,new Set());
        var affectedEntries=entries.filter(function(e){ return descIds.indexOf(e.folderId)!==-1; });
        var descFolderCount=descIds.length-1; // exclude the folder itself
        return (
          <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.55)"}}
              onClick={function(){ setDeletingFolderId(null); }}/>
            <div style={{position:"relative",background:"var(--color-background-primary)",
              borderRadius:10,border:"0.5px solid var(--color-border-secondary)",
              padding:"1.25rem 1.4rem",maxWidth:380,width:"90%",
              boxShadow:"0 8px 32px rgba(0,0,0,0.22)"}}>
              <p style={{fontWeight:600,fontSize:"0.92rem",marginBottom:"0.6rem",color:"var(--color-text-primary)"}}>
                Delete folder?
              </p>
              <p style={{fontSize:"0.82rem",color:"var(--color-text-secondary)",lineHeight:1.5,marginBottom:"0.5rem"}}>
                You are about to delete <strong>{folder.name}</strong>.
              </p>
              <p style={{fontSize:"0.82rem",color:"var(--color-text-secondary)",lineHeight:1.5,marginBottom:"0.5rem"}}>
                {affectedEntries.length>0||descFolderCount>0?(
                  "This will also permanently delete "+
                  (affectedEntries.length>0?affectedEntries.length+" joseki":"")+(affectedEntries.length>0&&descFolderCount>0?" and ":"")+
                  (descFolderCount>0?descFolderCount+" subfolder"+(descFolderCount===1?"":"s"):"")+" inside it."
                ):"This folder is empty."}
              </p>
              <p style={{fontSize:"0.82rem",color:"#7A2020",lineHeight:1.5,marginBottom:"1rem"}}>
                This cannot be undone.
              </p>
              <div style={{display:"flex",gap:"0.5rem",justifyContent:"flex-end"}}>
                <button className="btn btnsm" onClick={function(){ setDeletingFolderId(null); }}>Cancel</button>
                <button className="btn btnsm btnd" onClick={function(){
                  deleteFolder(deletingFolderId);
                  setDeletingFolderId(null);
                }}>Delete</button>
              </div>
            </div>
          </div>
        );
      })()}

            <div style={{textAlign:"center"}}>
              <div style={{fontSize:"2rem",fontWeight:700,letterSpacing:"-0.03em",lineHeight:1}}>Joseki Sage</div>
              <div style={{fontSize:"0.82rem",color:"var(--color-text-tertiary)",fontStyle:"italic",marginTop:2}}>A Go joseki training tool</div>
            </div>

                    {/* About */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">About</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              Joseki Sage is a browser-based Go joseki training application. It allows you to
              build and organize a personal library of joseki sequences, study them in an
              interactive editor, and test your recall in practice mode, which quizzes you
              on correct continuations, tracks your score and accuracy across sessions, and
              supports mirroring and color inversion to train pattern recognition from any orientation.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.75rem"}}>
              The app runs entirely in your browser as a single HTML file with no server
              required. Your library is stored locally in your browser and can be exported
              and imported as JSON files.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.75rem"}}>
              This app was vibe coded with AI due to my lacking the technical skills to create it myself
              and no existing application having the desired functionality. If you have understandable
              moral or practical objections to using an application created in this way, then you may
              want to look for an alternative.
            </p>
          </div>

          {/* How to use */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">How to Use</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}><strong>Library</strong> - Browse, organise, enable or disable joseki for practice. Import the default library via the Download/Import menu in the top bar. Use the folder structure to keep josekis organised between Default and Custom libraries.</p>
              <p style={{marginBottom:"0.6rem"}}><strong>Practice</strong> - Select joseki in the library and tap Practice, or use the start button in the Practice tab. The app randomly assigns you to play the first or second move of each sequence. Correct continuations are scored; wrong moves reveal valid alternatives. Settings allow mirroring, color inversion, and toggling of hints and comments.</p>
              <p style={{marginBottom:"0.6rem"}}><strong>New / Editor</strong> - Create joseki from scratch or edit existing ones. Place stones, add setup stones, annotate continuations with letters or markers, and write position comments. Import and export individual joseki as SGF files.</p>
              <p><strong>Scoring</strong> - Points are awarded per correct move, multiplied by a streak bonus (up to 3x at 5 consecutive correct moves). Accuracy is tracked as a percentage across the session. Scoring can be disabled in practice settings.</p>
            </div>
          </div>

          {/* Credits */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Credits & Acknowledgements</p>
            <div style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              <p style={{marginBottom:"0.6rem"}}>
                Inspired by <a href="https://joseki.cat" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>Joseki.cat</a>, an excellent joseki trainer without which this app would not exist.
              </p>
              <p style={{marginBottom:"0.6rem"}}>
                Default library data sourced from the <a href="https://online-go.com/joseki" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>OGS Joseki Explorer</a>, a community-maintained database of Go joseki sequences. Used with appreciation for the Go community's open contribution. Full credit for all the valuable information belongs to the contributors; any errors can be attributed to me.
              </p>
              <p>
                Stone placement and capture sounds from <a href="https://github.com/SabakiHQ/Sabaki" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>Sabaki</a> by Yichuan Shen (Copyright 2015-2022), used under the MIT licence. The MIT licence requires that this copyright notice be reproduced: Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated files to deal in the software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies, subject to the above copyright notice and this permission notice being included in all copies or substantial portions.
              </p>
            </div>
          </div>

          {/* License */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Licence</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>

            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginTop:"0.6rem"}}>
              <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>View full licence text</a>
            </p>
          </div>

          {/* Feedback & Support */}
          <div className="card" style={{marginBottom:"1.2rem"}}>
            <p className="sect">Feedback & Support</p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginBottom:"0.6rem"}}>
              Found a bug or have a suggestion? Send feedback to{" "}
              <a href="mailto:josekisage@gmail.com" style={{color:"#4A8870"}}>josekisage@gmail.com</a>.
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)",marginBottom:"0.6rem"}}>
              If you enjoy Joseki Sage and would like to buy me a coffee, that would be lovely:{" "}
              <a href="https://ko-fi.com/josekisage" target="_blank" rel="noopener noreferrer" style={{color:"#4A8870"}}>ko-fi.com/josekisage</a>
            </p>
            <p style={{fontSize:"0.88rem",lineHeight:1.7,color:"var(--color-text-secondary)"}}>
              This app is a non-commercial work and will always be free.
            </p>
          </div>

          <div style={{textAlign:"center",marginTop:"1.5rem"}}>
            <button className="btn btnsm" onClick={function(){ setTab(TABS.library); }}>Back to Library</button>
          </div>
        </div>
      )}
      {confirmDialog&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}
          onClick={function(e){ if(e.target===e.currentTarget) setConfirmDialog(null); }}>
          <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:10,padding:"1.5rem",maxWidth:360,width:"90%",boxShadow:"0 8px 32px rgba(0,0,0,0.3)"}}>
            <p style={{marginBottom:"1.2rem",fontSize:"0.9rem",lineHeight:1.6}}>{confirmDialog.msg}</p>
            <div style={{display:"flex",gap:"0.5rem",justifyContent:"flex-end"}}>
              <button className="btn btnsm" onClick={function(){ setConfirmDialog(null); }}>Cancel</button>
              <button className="btn btnsm btnd" onClick={function(){ confirmDialog.onConfirm(); setConfirmDialog(null); }}>Overwrite</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
